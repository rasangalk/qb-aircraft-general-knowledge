ads are balanced by:","o":["frequency regulation","torque of the CSD","regulating the energizing current","voltage regulation"],"a":2,"t":"accsd","fig":null,"s":"acel"},{"id":"144","page":49,"q":"On starting, in a brushless AC generator with no commutator rings, the generator is activated by:","o":["the stabilizer winding jointly with the voltage regulator","the main field winding","a set of permanent magnets","the auxiliary winding"],"a":2,"t":"acgen","fig":null,"s":"acel"},{"id":"146","page":49,"q":"As regards three-phase AC generators, the following conditions must be met for paralleling AC generators: 1. Equal voltage 2. Equal current 3. Equal frequencies 4. Same phase rotation 5. Voltages of same phase. The combination regrouping all the correct statements is:","o":["1, 3, 4, 5","1, 2, 3, 4","1, 3, 5","1, 4, 5"],"a":0,"t":"accsd","fig":null,"s":"acel"},{"id":"149","page":49,"q":"(Refer to figure 021-15) Which of this circuit diagram symbols represents a three phase star connection?","o":["A","B","C","D"],"a":3,"t":"acgen","fig":"021-15","s":"acel"},{"id":"150","page":50,"q":"The speed of an asynchronous four-pole motor fed at a frequency of 400 Hertz is:","o":["800 revolutions per minute","6000 revolutions per minute","12000 revolutions per minute","1600 revolutions per minute"],"a":2,"t":"acth","fig":null,"s":"acel"},{"id":"161","page":50,"q":"The main purpose of a Constant Speed Drive unit is to:","o":["maintain a constant frequency","take part in the balancing of reactive loads","mechanically protect the alternator drive shaft during coupling","take part in the voltage regulation"],"a":0,"t":"accsd","fig":null,"s":"acel"},{"id":"162","page":50,"q":"The frequency of an AC generator is dependent on the:","o":["number of pairs of poles and the speed of the rotor","number of individual poles and the field strength","field strength and the speed of the rotor","number of individual poles only"],"a":0,"t":"acgen","fig":null,"s":"acel"},{"id":"166","page":50,"q":"Assuming a CSD fault is indicated, the CSD should be disconnected:","o":["on the ground only","at flight idle engine rpm","in accordance with the regulated voltage level of the AC generator","during engine operation only"],"a":3,"t":"accsd","fig":null,"s":"acel"},{"id":"170","page":50,"q":"When a persistent top excitation limit fault on an AC generator connected to the mains with another AC generator, the overexcitation protection device opens:","o":["the generator breaker","the tie breaker","the exciter breaker and the generator breaker","the exciter breaker, the generator breaker and the tie breaker"],"a":3,"t":"acprot","fig":null,"s":"acel"},{"id":"178","page":50,"q":"The function of a CSD in an AC generating system is to:","o":["vary the engine rpm (within limits) to compensate for various AC loads","drive the generator at a constant speed","vary generator rpm in order to compensate for various AC loads","directly maintain a constant proportion between the rpm of engine and generator"],"a":1,"t":"accsd","fig":null,"s":"acel"},{"id":"185","page":50,"q":"The advantages of alternating current on board an aircraft are: 1) simple connection 2) high starting torque 3) flexibility in use 4) lighter weight of equipment 5) easy to convert into direct current 6) easy maintenance of machines. The combination of correct statements is:","o":["3, 4, 5, 6","1, 2, 3, 4, 5, 6","1, 2, 3, 5, 6","1, 4, 6"],"a":0,"t":"acth","fig":null,"s":"acel"},{"id":"187","page":50,"q":"A thermal circuit breaker:","o":["can be reset without any danger even if the fault remains","is a protection system with a quick break capacity of about one hundredth of a second","forbids any overcurrent","protects the system in the event of overheating, even without exceeding the maximum permissible current"],"a":3,"t":"acprot","fig":null,"s":"acel"},{"id":"190","page":50,"q":"A CSD unit which has been disconnected in flight:","o":["automatically resets at engine shut-down","may be reset in flight using the reset mechanism","automatically resets in flight providing engine rpm is below a given value","may be reset on the ground only, after engine shut-down"],"a":3,"t":"accsd","fig":null,"s":"acel"},{"id":"194","page":50,"q":"In order to produce an alternating voltage of 400 Hz, the number of poles required in an AC generator running at 6000 rpm is:","o":["4","8","12","24"],"a":0,"t":"acgen","fig":null,"s":"acel"},{"id":"195","page":50,"q":"The frequency of the current provided by an alternator depends on...","o":["its rotation speed","the strength of the excitation current","its load","its phase balance"],"a":0,"t":"acgen","fig":null,"s":"acel"},{"id":"199","page":51,"q":"What happens to the current in a series capacitive circuit when frequency increases?","o":["Increases or decreases depending on the capacity of the circuit","Current increases","Current decreases","Current neither increases nor decreases"],"a":1,"t":"acth","fig":null,"s":"acel"},{"id":"216","page":51,"q":"To ensure correct load sharing between AC generators operating in parallel:","o":["the matching of loads is unimportant","both real and reactive loads must be matched","only reactive loads need to be matched","only real loads need to be matched"],"a":1,"t":"accsd","fig":null,"s":"acel"},{"id":"221","page":51,"q":"\"Frequency wild\" in relation to a AC generation system means the generator:","o":["output frequency varies with engine speed","output frequency is too high","voltage regulator is out of adjustment","output frequency is too low"],"a":0,"t":"acgen","fig":null,"s":"acel"},{"id":"223","page":51,"q":"When a persistent overexcitation fault is detected on only one AC generator, the protection device opens the:","o":["tie breaker","exciter breaker, generator breaker and tie breaker","exciter breaker and generator breaker","generator breaker and tie breaker"],"a":2,"t":"acprot","fig":null,"s":"acel"},{"id":"235","page":51,"q":"When operating two AC generators unparalleled, the phase relationship of each generator:","o":["must be synchronous","is unimportant","must be in opposition","must be 90° out of synchronisation"],"a":1,"t":"accsd","fig":null,"s":"acel"},{"id":"236","page":51,"q":"As regards the Generator Control Unit (GCU) of an AC generator, it can be said that: 1. The GCU controls the AC generator voltage 2. Modern GCUs are provided with a permanent indication to record the failure 3. All the commands originating from the control panel are applied via the GCU, except dog clutch release 4. The Auxiliary Power Unit (APU) provides the excitation of the AC generator as soon as the APU starts up. The combination regrouping all the correct statements is:","o":["3, 4","2, 3","2, 4","1, 3"],"a":1,"t":"acgen","fig":null,"s":"acel"},{"id":"242","page":51,"q":"Real load sharing in a parallel AC system is achieved by:","o":["carefully selecting the number of loads on the bus-bars at any one time","automatic adjustment of the torque on each generator rotor via the CSD unit","controlling the generator field current","monitoring the kVAR of each generator/alternator"],"a":1,"t":"accsd","fig":null,"s":"acel"},{"id":"246","page":51,"q":"The most widely used electrical frequency in aircraft is:","o":["60 Hz","200 Hz","50 Hz","400 Hz"],"a":3,"t":"acgen","fig":null,"s":"acel"},{"id":"259","page":51,"q":"A Constant Speed Drive aims at ensuring:","o":["equal AC voltage from all generators","that the starter-motor maintains a constant RPM notwithstanding the acceleration of the engine","that the CSD remains at a constant RPM notwithstanding the generator RPM","that the electric generator produces a constant frequency"],"a":3,"t":"accsd","fig":null,"s":"acel"},{"id":"262","page":52,"q":"On-board electrical systems are protected against faults of the following type: 1) AC generator over-voltage 2) AC generator under-voltage 3) over-current 4) over-speed 5) under-frequency 6) undue vibration of AC generators. The combination of correct statements is:","o":["1, 2, 4, 5","1, 2, 4, 6","1, 3, 5, 6","2, 3, 4, 5, 6"],"a":0,"t":"acprot","fig":null,"s":"acel"},{"id":"264","page":52,"q":"A CSD of an AC generator may be disconnected in flight. The primary reason(s) for disconnection are:","o":["low oil pressure and/or high oil temperature of the generator drive","excessive variation of voltage and kVAR","illumination of the CSD disconnect warning light","slight variation about the normal operating frequency"],"a":0,"t":"accsd","fig":null,"s":"acel"},{"id":"275","page":52,"q":"(Refer to figure 021-15) Which of this circuit diagram symbols represents a transformer with independent primary and secondary coils?","o":["A","B","C","D"],"a":0,"t":"acth","fig":"021-15","s":"acel"},{"id":"284","page":52,"q":"The purpose of a voltage regulator is to control the output voltage of the:","o":["generators at varying speeds and the batteries at varying loads","batteries at varying loads","generator at varying loads and speeds","output of the TRU"],"a":2,"t":"acgen","fig":null,"s":"acel"},{"id":"285","page":52,"q":"If two constant frequency AC generators are operating independently, then the phase relation between both generators:","o":["must be synchronised","is unimportant","must be 120° out of phase","must be 240° out of phase"],"a":1,"t":"acgen","fig":null,"s":"acel"},{"id":"293","page":52,"q":"An AC generator driven by a CSD unit:","o":["does not need a voltage controller since the CSD will ensure constant voltage","requires a voltage controller to maintain constant voltage under load","does not need a voltage controller since an AC generator voltage cannot alter under load","requires a voltage controller to maintain constant frequency"],"a":1,"t":"accsd","fig":null,"s":"acel"},{"id":"300","page":52,"q":"(Refer to figure 021-15) Which of this circuit diagram symbols represents a relay?","o":["A","B","C","D"],"a":1,"t":"acth","fig":"021-15","s":"acel"},{"id":"309","page":52,"q":"On the flight deck, an oil operated CSD unit is normally provided with means of monitoring the:","o":["low oil temperature and low oil quantity","oil temperature and synchronous speed","output speed and oil pressure","oil over-temperature and low oil pressure"],"a":3,"t":"accsd","fig":null,"s":"acel"},{"id":"311","page":52,"q":"On an aeroplane utilising AC as primary power supplies, the batteries are charged in flight from:","o":["the AC bus via current limiters","a static inverter","a DC transformer and rectifier","a Transformer Rectifier Unit"],"a":3,"t":"acdist","fig":null,"s":"acel"},{"id":"312","page":52,"q":"The measured output power components of a constant frequency AC system are:","o":["volts and amperes","kVA and kVAR","volts and kilowatts","amperes and kilowatts"],"a":1,"t":"acgen","fig":null,"s":"acel"},{"id":"317","page":52,"q":"The output of a generator is controlled by:","o":["varying the field strength","varying the speed of the engine","varying the length of wire in the armature windings","the reverse current relay circuit breaker"],"a":0,"t":"acgen","fig":null,"s":"acel"},{"id":"319","page":52,"q":"A 3 phase AC generator has 3 separate stator windings spaced at:","o":["90°","60°","45°","120°"],"a":3,"t":"acgen","fig":null,"s":"acel"},{"id":"422","page":53,"q":"In an aeroplane equipped with a DC main power system, AC for instrument operation may be obtained from:","o":["a rectifier","an inverter","a contactor","a TRU"],"a":1,"t":"acdist","fig":null,"s":"acel"},{"id":"441","page":53,"q":"A relay is:","o":["an electrical security switch","an electromagnetically operated switch","a switch specially designed for AC circuits","an electrical energy conversion unit"],"a":1,"t":"acth","fig":null,"s":"acel"},{"id":"452","page":53,"q":"The purpose of static wick dischargers is to:","o":["dissipate static charge from the aircraft skin after landing","dissipate static charge of the aircraft inflight thus avoiding radio interference as a result of static electricity","provide a path to ground for static charges when refuelling","be able to fly higher because of less electrical friction"],"a":1,"t":"acdist","fig":null,"s":"acel"},{"id":"482","page":53,"q":"The function of the Generator Breaker is to close when the voltage of the:","o":["battery is greater than the generator voltage and to open when the opposite is true","generator is greater than battery voltage and to open when the opposite is true","alternator is greater than the battery voltage and to open when the opposite is true","battery is greater than the alternator voltage and to open when the opposite is true"],"a":1,"t":"acprot","fig":null,"s":"acel"},{"id":"486","page":53,"q":"The reason for using inverters in an electrical system is..","o":["To change DC into AC","To change the DC voltage","To change AC into DC","To avoid a short circuit"],"a":0,"t":"acdist","fig":null,"s":"acel"},{"id":"510","page":53,"q":"Electrical bonding of an aircraft is used to: 1) protect the aircraft against lightning effects 2) reset the electrostatic potential of the aircraft to a value approximating 0 volt 3) reduce radio interference on radiocommunication systems 4) set the aircraft to a single potential. The combination regrouping all the correct statements is:","o":["2, 4","1, 2, 3","3, 4","1, 3, 4"],"a":3,"t":"acdist","fig":null,"s":"acel"},{"id":"513","page":53,"q":"It may be determined that an aircraft is not properly bonded if:","o":["a circuit breaker pops out","static noises can be heard on the radio","there is interference on the VOR receiver","there is heavy corrosion on the fuselage skin mountings"],"a":1,"t":"acdist","fig":null,"s":"acel"},{"id":"523","page":53,"q":"When an OPEN CIRCUIT occurs in an electrical supply system, the:","o":["load as indicated by the ammeter will increase","fuse or CB should isolate the circuit due to excess current drawn","component will operate normally, but will not switch off","loss of continuity will prevent its working components from functioning"],"a":3,"t":"acth","fig":null,"s":"acel"},{"id":"567","page":53,"q":"A \"trip-free\" type circuit breaker is a circuit protection device which:","o":["is free from the normal CB tripping characteristic","will not allow the contacts to be held closed while a current fault exists in the circuit","can be reset at any time","will allow the contacts to be held closed in order to clear a fault in the circuit"],"a":1,"t":"acprot","fig":null,"s":"acel"},{"id":"571","page":54,"q":"Static dischargers: 1) are used to set all the parts of the airframe to the same electrical potential 2) are placed on wing and tail tips to facilitate electrical discharge 3) are used to reset the electrostatic potential of the aircraft to a value approximating 0 volts 4) are located on wing and tail tips to reduce interference with the on-board radiocommunication systems to a minimum 5) limit the risks of transfer of electrical charges between the aircraft and the electrified clouds. The combination regrouping all the correct statements is:","o":["1, 2, 5","2, 4, 5","1, 3, 4","3, 4, 5"],"a":1,"t":"acdist","fig":null,"s":"acel"},{"id":"582","page":54,"q":"A magnetic circuit breaker:","o":["is a quick tripping response protective system","permits overvoltage for a short period of time","has a slow response time","can be reset without danger"],"a":0,"t":"acprot","fig":null,"s":"acel"},{"id":"586","page":54,"q":"A unit that converts electrical DC into AC is:","o":["a thermistor","an AC generator","a transformer rectifier unit","an inverter"],"a":3,"t":"acdist","fig":null,"s":"acel"},{"id":"594","page":54,"q":"Circuit breakers protecting circuits may be:","o":["reset at any time","used only in AC circuits","used only in DC circuits","used in AC and DC circuits"],"a":3,"t":"acprot","fig":null,"s":"acel"},{"id":"2744","page":54,"q":"The services connected to a supply bus-bar are normally in:","o":["parallel, so that isolation of loads decreases the bus-bar voltage","series, so that isolation of loads increases the bus-bar voltage","parallel, so that isolating individual loads rt in an AC generator is usually referred to as the:","o":["stator","rotor","oscillator","slip ring"],"a":1,"t":"acgen","fig":null,"s":"acel"},{"id":"20421","page":56,"q":"The power required for field excitation of the main rotor in modern constant-frequency alternators is directly controlled by:","o":["the voltage regulator","an excitation alternator with a permanent magnet generator","an AC generator","a battery"],"a":0,"t":"acgen","fig":null,"s":"acel"},{"id":"20422","page":56,"q":"The primary function of a constant speed drive (CSD) in an AC generating system is to:","o":["vary the engine rpm (within limits) to compensate for various AC loads","drive the generator at a constant speed","adjust generator rpm in order to compensate for various AC loads","directly maintain a constant proportion between the rpm of engine and generator"],"a":1,"t":"accsd","fig":null,"s":"acel"},{"id":"20443","page":56,"q":"The reasons for disconnecting a constant speed drive (CSD) of an AC generator in flight are: 1) low oil pressure in the CSD 2) slight variation about the normal operating frequency 3) high oil temperature in the CSD 4) excessive variation of output voltage. The combination regrouping all the correct statements is:","o":["1, 4","2, 4","1, 3","2, 3"],"a":2,"t":"accsd","fig":null,"s":"acel"},{"id":"20484","page":56,"q":"When the AC generators are connected in parallel, the reactive loads are balanced by means of the:","o":["torque of the constant speed drive (CSD)","frequency or load controller","voltage controller","excitation current"],"a":3,"t":"accsd","fig":null,"s":"acel"},{"id":"20485","page":56,"q":"When the supply frequency in a circuit with a capacitor is increased, the current in this circuit will:","o":["increase","be zero","decrease","remain the same"],"a":0,"t":"acth","fig":null,"s":"acel"},{"id":"21423","page":56,"q":"The main features of a unipole system are: 1) Lighter 2) Easier fault finding 3) More likely to short circuit 4) Less likely to short circuit 5) It is not a single wire system. The combination regrouping all the correct statements is:","o":["1, 2 and 3","1, 2 and 4","3 only","1, 3 and 5"],"a":1,"t":"acdist","fig":null,"s":"acel"},{"id":"21942","page":56,"q":"A hot busbar is one that is:","o":["Used to provide an alternative current","Kept in operating conditions by an electrical resistance in the case of energy failure","Connected directly to the battery","Automatically connected to the battery if generators have failed"],"a":2,"t":"acdist","fig":null,"s":"acel"},{"id":"21954","page":56,"q":"What is a relay?","o":["A solenoid valve","A magnetic switch","A device converting electrical energy into heat","A device used in a starter motor circuit"],"a":1,"t":"acth","fig":null,"s":"acel"},{"id":"21956","page":56,"q":"In an AC circuit:","o":["The battery is connected in series","The battery cannot be used because the voltage is low","A battery is not fitted","Battery output must be inverted"],"a":2,"t":"acth","fig":null,"s":"acel"},{"id":"21959","page":57,"q":"The shunt wound generator produces an output in which:","o":["The voltage increases with increase in load","The voltage remains constant with increase in load","The voltage decreases slightly with increase in load","Voltage is proportional to the current"],"a":2,"t":"acgen","fig":null,"s":"acel"},{"id":"21960","page":57,"q":"In an electrical circuit the reverse current relay will open:","o":["When battery voltage exceeds generator voltage","When circuit voltage is less than generator voltage","When the batteries are flat","When the battery is being charged"],"a":0,"t":"acprot","fig":null,"s":"acel"},{"id":"21961","page":57,"q":"Generator cut-out (reverse current relay) contacts are kept open by:","o":["Magnetism","Spring tension","Generator speed","Current flow"],"a":1,"t":"acprot","fig":null,"s":"acel"},{"id":"21962","page":57,"q":"What is the purpose of the GCB?","o":["Controls the generator fixed excitation","Connects a generator busbar to a paired "The reading on the oil pressure gauge is the:","o":["pressure of the oil on the outlet side of the pressure pump","difference between the pressure pump pressure and the scavenge pump pressure","pressure in the oil tank reservoir","pressure of the oil on the inlet side of the pressure pump"],"a":0,"t":"pefuel","fig":null,"s":"pe"},{"id":"6512","page":69,"q":"The main advantage of a constant speed propeller as compared to a fixed pitch propeller is a:","o":["higher efficiency in all operating ranges","constant efficiency in all operating ranges","lower propeller blade stress","higher efficiency in cruising range"],"a":0,"t":"peprop","fig":null,"s":"pe"},{"id":"6528","page":69,"q":"The power output of a normally aspirated piston engine increases with increasing altitude at constant Manifold Air Pressure (MAP) and RPM because of the:","o":["lower friction losses","lower losses during the gas change","lower back pressure","leaner mixture at higher altitudes"],"a":2,"t":"pesup","fig":null,"s":"pe"},{"id":"6532","page":69,"q":"If the ground wire between the magneto and the ignition switch becomes disconnected, the most noticeable result will be that the engine:","o":["will not operate at the left magneto","cannot be shut down by turning the switch to the OFF position","will not operate at the right magneto","cannot be started with the switch in the ON position"],"a":1,"t":"peign","fig":null,"s":"pe"},{"id":"6540","page":69,"q":"Ignition systems of piston engines are:","o":["independent from the electrical system of the aeroplane","dependent on the battery","dependent on the DC-Generator","dependent on the AC-Generator"],"a":0,"t":"peign","fig":null,"s":"pe"},{"id":"6541","page":69,"q":"The octane rating of a fuel characterises the:","o":["the anti-knock capability","fuel volatility","quantity of heat generated by its combustion","fuel electrical conductivity"],"a":0,"t":"pefuel","fig":null,"s":"pe"},{"id":"6955","page":69,"q":"A turbo-supercharger impeller is driven by:",  to cause fuel to flow through the carburettor jets"],"a":3,"t":"pecarb","fig":null,"s":"pe"},{"id":"7016","page":70,"q":"In twin-engine aeroplanes with right turning propellers:","o":["the 'minimum control speed' is determined by the failure of the right engine","the left engine produces a higher yaw moment if the right engine fails than vice versa","the left engine is the critical motor","the right engine is the critical motor"],"a":2,"t":"peprop","fig":null,"s":"pe"},{"id":"7022","page":70,"q":"When altitude increases without adjustment of the mixture ratio, the piston engine performance is affected because of a:","o":["decreasing of air density for a constant quantity of fuel","constant air density for a bigger quantity of fuel","increasing of air density for smaller quantity of fuel","decreasing of air density for a smaller quantity of fuel"],"a":0,"t":"pecarb","fig":null,"s":"pe"},{"id":"7023","page":70,"q":"If an engine fails to stop with the magneto switch in OFF position, the cause may be:","o":["excessive carbon formation in cylinder head","switch wire grounded","defective condenser","fouled spark plugs"],"a":0,"t":"peign","fig":null,"s":"pe"},{"id":"7027","page":70,"q":"To adjust the mixture ratio of a piston engine when altitude increases, means to:","o":["increase the mixture ratio","decrease the amount of fuel in the mixture in order to compensate for the increasing air density","increase the amount of fuel in the mixture to compensate for the decreasing air pressure and density","decrease the fuel flow in order to compensate for the decreasing air density"],"a":3,"t":"pecarb","fig":null,"s":"pe"},{"id":"7029","page":70,"q":"An impulse magneto coupling:","o":["advances ignition timing and gives a hotter spark at starting","reduces magneto speed during engine warm-up","gives a retarded spark at starting","gives an automatic spark increase during high speed operation"],"a":2,"t":"peign","fig":null,"s":"pe"},{"id":"7040","page":70,"q":"In a piston engine gine (non turbo-charged), the manifold pressure gauge always indicates...","o":["a lower value than atmospheric pressure when the engine is running","a greater value than atmospheric pressure when the engine is running","zero on the ground when the engine is stopped","a value equal to the QFE when the engine is at full power on the ground"],"a":0,"t":"pesup","fig":null,"s":"pe"},{"id":"7082","page":71,"q":"The air in a piston engine turbo-supercharger centrifugal compressor:","o":["enters the eye of the impeller and leaves at a tangent to the periphery","enters via the diffuser and is fed to the impeller at the optimum angle of attack","enters at the periphery and leaves via the eye of the impeller","enters at a tangent to the rotor and leaves via the stator"],"a":0,"t":"pesup","fig":null,"s":"pe"},{"id":"7092","page":71,"q":"What would happen if the waste gate of a turbo-charged engine seized in the descent?","o":["Compressor will overspeed","Turbine blades will fail","MAP may exceed its maximum permitted value in the induction manifold","RPM may exceed its maximum permitted value"],"a":2,"t":"pesup","fig":null,"s":"pe"},{"id":"7099","page":71,"q":"The kind of compressor normally used as a supercharger is:","o":["a hybrid compressor","an axial compressor","a radial compressor","a piston compressor"],"a":2,"t":"pesup","fig":null,"s":"pe"},{"id":"7106","page":71,"q":"In general, in twin-engine aeroplanes with 'constant speed propeller'","o":["the oil pressure turns the propeller blades towards smaller pitch angle","the aerodynamic force turns the propeller blades towards higher pitch angle","the spring force turns the propeller blades towards smaller pitch angle","the oil pressure turns the propeller blades towards higher pitch angle"],"a":0,"t":"peprop","fig":null,"s":"pe"},{"id":"7112","page":71,"q":"In modern aircraft, a pilot can actuate the feather system by:","o":["pulling the propeller control lever rearwards","pushing the propeller control lever forwards","pu lution","once per revolution","once per two revolutions"],"a":0,"t":"tecyc","fig":null,"s":"turb"},{"id":"6521","page":89,"q":"Consider a jet engine whose control is based on the Engine Pressure Ratio (EPR): 1) with a constant EPR, the thrust decreases when the altitude increases 2) with a constant EPR, the thrust is independent of the Mach number 3) at same environmental conditions, a given EPR setting maintains the thrust irrespective of engine wear due to ageing 4) the EPR is determined by the impact pressure difference between the turbine outlet and the compressor inlet 5) on take-off, in the event of icing not detected by the crew, the indicated EPR is lower than the real EPR. The combination regrouping all the correct statements is:","o":["1, 5","2, 3, 4","3, 4, 5","1, 3"],"a":3,"t":"teops","fig":null,"s":"turb"},{"id":"7034","page":89,"q":"What limits the max. temperature in a gas turbine engine?","o":["temperature in the combustion chamber","temperature at the exhaust","temperature at the turbine","temperature entering the combustion chamber"],"a":2,"t":"teturb","fig":null,"s":"turb"},{"id":"7036","page":89,"q":"The control of free turbine engines on turboprops is accomplished by: a propeller control lever used to select: 1) propeller RPM 2) turbine temperature 3) turbine RPM; a fuel control lever used to select: 4) propeller RPM 5) torque 6) turbine temperature. The combination which regroups all of the correct statements is:","o":["1 - 3 - 5","1 - 5 - 6","3 - 4 - 6","2 - 4 - 5"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"7053","page":89,"q":"In a gas turbine engine, the maximum gas temperature is attained:","o":["at the entry to the exhaust unit","across the turbine","in the cooling airflow around the flame tube","within the combustion chamber"],"a":3,"t":"teturb","fig":null,"s":"turb"},{"id":"7069","page":89,"q":"In a single spool gas turbine engine, the compressor rpm is:","o":["greater than turbine rpm","independent of turbine rpm","the same as turbine rpm","less than turbine rpm"],"a":2,"t":"tecomp","fig":null,"s":"turb"},{"id":"7129","page":89,"q":"What happens to pressure, temperature and velocity of the air in the diffuser of a centrifugal compressor?","o":["Velocity increase, pressure and temperature decrease","Velocity decrease, pressure and temperature increase","Velocity, pressure and temperature increase","Velocity, pressure and temperature decrease"],"a":1,"t":"tecomp","fig":null,"s":"turb"},{"id":"7139","page":89,"q":"In a gas turbine engine, compressor blades, which are not rigidly fixed in position when the engine is stationary, take up a rigid position when the engine is running due to:","o":["the resultant of aerodynamic and centrifugal forces","oil pressure","thermal expansion","blade creep"],"a":0,"t":"tecomp","fig":null,"s":"turb"},{"id":"7162","page":89,"q":"The thrust of a turbo-jet, at the selection of full power: 1) equals the product of the exhaust gas mass flow and the exhaust gas velocity 2) is obtained by pressure of the exhaust gas on the ambient air 3) is equivalent to zero mechanical power since the aeroplane is not moving 4) is independent of the outside air temperature. The combination which regroups all of the correct statements is:","o":["2 - 3","1 - 2","1 - 3","4"],"a":2,"t":"tefan","fig":null,"s":"turb"},{"id":"7163","page":89,"q":"In a centrifugal compressor:","o":["the air enters the eye tangentially and leaves the periphery axially","the air enters the periphery axially and leaves the eye tangentially","the air enters the eye radially and leaves the tip tangentially","the air enters the impeller axially at the eye and leaves at the periphery tangentially"],"a":3,"t":"tecomp","fig":null,"s":"turb"},{"id":"7299","page":90,"q":"Where is torque measured in a turboprop engine?","o":["Accessory gearbox","Reduction gearbox","At the turbine","At the constant speed unit oil pump"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"7340","page":90,"q":"An engine pressure ratio (EPR) gauge reading normally shows the ratio of:","o":["jet pipe pressure to combustion chamber pressure","jet pipe pressure to compressor inlet pressure","combustion chamber pressure to compressor inlet pressure","compressor outlet pressure to compressor inlet pressure"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"7368","page":90,"q":"When the combustion gases pass through a turbine the:","o":["pressure rises","pressure drops","velocity decreases","temperature increases"],"a":1,"t":"teturb","fig":null,"s":"turb"},{"id":"7371","page":90,"q":"If air is tapped from a gas turbine HP compressor, the effect on the engine pressure ratio (EPR) and the exhaust gas temperature (EGT) is that:","o":["EPR decreases and EGT remains constant","both EPR and EGT decrease","EPR decreases and EGT increases","EPR remains constant and EGT increases"],"a":2,"t":"teops","fig":null,"s":"turb"},{"id":"7506","page":90,"q":"A \"hung start\" is the failure of an engine to accelerate to its normal idle speed. It may be caused by:","o":["an attempt to ignite the fuel before the engine has been accelerated sufficiently by the starter","compressor surging","the starter cutting out early in the starting sequence before the engine has accelerated to the required rpm for ignition","failure of the fuel to ignite in the starting sequence after the engine has been accelerated to the required rpm by the starter"],"a":0,"t":"teops","fig":null,"s":"turb"},{"id":"7510","page":90,"q":"In a turbo-jet, the purpose of the turbine is to...","o":["compress the air in order to provide a better charge of the combustion chamber","drive devices like pumps, regulator, generator","drive the compressor by using part of the energy from the exhaust gases","clear the burnt gases, the expansion of which provide the thrust"],"a":2,"t":"teturb","fig":null,"s":"turb"},{"id":"7536","page":90,"q":"The Engine Pressure Ratio (EPR) is the ratio of:","o":["the total turbine inlet pressure to the total compressor inlet pressure","total compressor outlet pressure to the total turbine outlet pressure","total compressor inlet pressure to the total turbine outlet pressure","the total turbine outlet pressure to the total compressor inlet pressure"],"a":3,"t":"teops","fig":null,"s":"turb"},{"id":"7551","page":90,"q":"In the stator of a turbine, the gas velocity V and static pressure Ps vary as follows:","o":["V decreases, Ps increases","V increases, Ps increases","V decreases, Ps decreases","V increases, Ps decreases"],"a":3,"t":"teturb","fig":null,"s":"turb"},{"id":"7555","page":90,"q":"In a gas turbine engine, the power changes are normally made by controlling the amount of:","o":["air leaving the compressor by opening or closing of bleed valves","fuel supplied","air entering the compressor","air entering the compressor and fuel entering the combustion chambers"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"7559","page":90,"q":"In a compressor stage of a jet engine, the sequence is:","o":["rotor - stator","stator - rotor","stator - stator - rotor","rotor - rotor - stator"],"a":0,"t":"tecomp","fig":null,"s":"turb"},{"id":"7564","page":90,"q":"The compressor surge effect during acceleration is prevented by the:","o":["Fuel Control Unit (F.C.U.)","inlet guide vanes","surge bleed valves","variable setting type nozzle guide vanes"],"a":0,"t":"tecomp","fig":null,"s":"turb"},{"id":"12363","page":90,"q":"A typical gas turbine overall air/fuel ratio is:","o":["10:1","60:1","136:1","200:1"],"a":1,"t":"teturb","fig":null,"s":"turb"},{"id":"12371","page":90,"q":"The secondary airflow is:","o":["Primarily concerned with combustion","Primarily concerned with forming a swirl vortex","Primarily concerned with cooling the gas flow prior to entering the NGV and turbines, and the flame tube and air casing material","Concerned with fuel nozzle atomisation"],"a":2,"t":"teturb","fig":null,"s":"turb"},{"id":"12372","page":91,"q":"As the gas flows through the turbine:","o":["Pressure, velocity and temperature gradually decrease","Pressure, velocity and temperature increase","Pressure decreases, velocity increases and temperature decreases","Pressure decreases, velocity decreases and temperature increases"],"a":0,"t":"teturb","fig":null,"s":"turb"},{"id":"12373","page":91,"q":"In a high bypass engine exhaust, the cold flow is usually exhausted:","o":["With the hot gas flow and flows through a mixer unit","Through the air conditioning system","Into the LP compressor inlet","Separately"],"a":3,"t":"tefan","fig":null,"s":"turb"},{"id":"12380","page":91,"q":"A simple bypass engine has:","o":["All of the airflow through the engine routed through the bypass duct","None of the airflow routed through the engine core","A proportion of air routed through the engine core and the rest goes down the bypass duct","A fan that delivers about half the engine thrust"],"a":2,"t":"tefan","fig":null,"s":"turb"},{"id":"12383","page":91,"q":"The two types of thrust augmentation are:","o":["Water / Methanol injection and triple bypass spool","Afterburning and reheat","Water injection and variable nozzle control mechanisms","Afterburning and water / methanol injection"],"a":3,"t":"tefan","fig":null,"s":"turb"},{"id":"12384","page":91,"q":"When a turbo prop anti-icing system is switched on whilst at cruise:","o":["Propeller RPM remains unchanged, turbine temperature rises and torque reduces","Propeller RPM reduces, turbine temperature reduces and torque increases","Propeller RPM remains unchanged, turbine temperature reduces and torque reduces","Propeller RPM remains unchanged, turbine temperature remains unchanged and torque remains unchanged"],"a":0,"t":"teops","fig":null,"s":"turb"},{"id":"12388","page":91,"q":"The noisiest part of a gas turbine engine is the:","o":["Fan","LP compressor","HP compressor","Jet efflux"],"a":3,"t":"tefan","fig":null,"s":"turb"},{"id":"20171","page":91,"q":"For a fan jet engine, the by-pass ratio is the:","o":["cold air mass flow divided by the hot air mass flow","hot air mass flow divided by the cold air mass flow","hot air mass flow divided by the fuel flow","fuel flow divided by hot air mass flow"],"a":0,"t":"tefan","fig":null,"s":"turb"},{"id":"20233","page":91,"q":"About a twin spool compressor:","o":["The low pressure spool runs at a very high rpm, thus preventing the onset of compressor stall","Both spools run at the same rpm","The low pressure spool runs at a lower rpm than the high pressure spool","When operating at very high rpm's, the later stages within the high pressure spool will have a large negative angle of attack"],"a":2,"t":"tecomp","fig":null,"s":"turb"},{"id":"20236","page":91,"q":"After air has passed through the compressor of a gas turbine engine the:","o":["pressure will be the same as the inlet pressure","velocity will be higher than the inlet velocity","temperature will be higher than the inlet temperature","velocity will be the same as the inlet velocity"],"a":2,"t":"tecomp","fig":null,"s":"turb"},{"id":"20242","page":91,"q":"An axial compressor, when operating below its design speed, has:","o":["a tendency to stall in the centre stages","a tendency to stall in the rear stages","a tendency to stall in the front stages","no tendency to stall"],"a":2,"t":"tecomp","fig":null,"s":"turb"},{"id":"20244","page":91,"q":"An engine pressure ratio (EPR) can be defined as the ratio of:","o":["jet pipe total pressure to combustion chamber pressure","jet pipe total pressure to compressor inlet total pressure","combustion chamber pressure to compressor inlet total pressure","compressor outlet pressure to compressor inlet total pressure"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"20253","page":91,"q":"Both gas turbine and piston engines utilise a cycle of induction, compression, combustion and exhaust. However in the gas turbine these processes are (i) and combustion occurs at (ii). Respectively (i) and (ii) are:","o":["(i) continuous; (ii) constant pressure","(i) continuous; (ii) constant volume","(i) intermittent; (ii) constant pressure","(i) intermittent; (ii) constant volume"],"a":0,"t":"tecyc","fig":null,"s":"turb"},{"id":"20254","page":92,"q":"By-pass ratio in a turbine engine is the ratio of the:","o":["speed of the combusted air to the speed of the by-pass air","cold air mass flow to the hot air mass flow","intake air pressure to the turbine delivery air pressure","tertiary air mass flow to the primary air mass flow"],"a":1,"t":"tefan","fig":null,"s":"turb"},{"id":"20261","page":92,"q":"Creep of turbine blades is caused by:","o":["high blade temperature whilst under centrifugal loading","prolonged idling at low rpm","bending stresses set up by gas pressure","static imbalance of the blades"],"a":0,"t":"teturb","fig":null,"s":"turb"},{"id":"20267","page":92,"q":"During take-off, the fan in a high by-pass ratio turbofan engine produces:","o":["the lesser part of the thrust","half the thrust","the greater part of the thrust","all the thrust"],"a":2,"t":"tefan","fig":null,"s":"turb"},{"id":"20275","page":92,"q":"Exhaust gas temperature sensing is usually taken:","o":["between the gas generator turbine and the free power turbine","at the outlet from the combustion chamber","after the free power turbine","between the stages of the gas generator turbine"],"a":0,"t":"teops","fig":null,"s":"turb"},{"id":"20282","page":92,"q":"For a subsonic airflow, air passing through a divergent duct:","o":["decreases in velocity and increases in pressure","increases in velocity and decreases in pressure","decreases in pressure and velocity","increases in pressure and velocity"],"a":0,"t":"tecyc","fig":null,"s":"turb"},{"id":"20312","page":92,"q":"In a free turbine engine, the energy delivered by the free turbine stages:","o":["is not connected with the rotation speed of the generator","is used to drive the compressor and the main rotor gearbox","is dependent on the rotational speed of the gas generator","is used to drive the compressor only"],"a":2,"t":"teturb","fig":null,"s":"turb"},{"id":"20317","page":92,"q":"In a jet engine the propelling nozzle:","o":["directs the hot gas stream onto the turbine at the optimum angle of attack","reduces noise","must be designed to obtain the correct balance of pressure and velocity to prevent flow separation","decreases the velocity and increases the pressure in the jet pipe to provide greater thrust"],"a":2,"t":"tefan","fig":null,"s":"turb"},{"id":"20318","page":92,"q":"In a multi-spool turbofan engine, the fan is driven by:","o":["the intermediate turbine","the rearmost turbine","the foremost turbine","all three turbines since they are on a common shaft with the compressor"],"a":1,"t":"tefan","fig":null,"s":"turb"},{"id":"20329","page":92,"q":"In the airflow through a single-spool axial flow turbo-jet engine, the axial velocity of the air is greatest:","o":["as it leaves the turbine","as it leaves the compressor","within the combustion chamber","on exit from the propelling nozzle"],"a":3,"t":"tecomp","fig":null,"s":"turb"},{"id":"20347","page":92,"q":"On landing and prior to shut down, a gas turbine engine should be run at \"GROUND IDLE\" for a short period. This allows:","o":["the core temperature to diminish","the turbine blade temperature to reduce only","the engine to be compressor washed","cool oil flushing of bearings, particularly those in the turbines"],"a":0,"t":"teops","fig":null,"s":"turb"},{"id":"20350","page":92,"q":"One definition of engine pressure ratio (EPR) is the ratio of:","o":["the total turbine outlet pressure to the total compressor inlet pressure","the total turbine outlet pressure to the total compressor outlet pressure","the total turbine inlet pressure to the total compressor inlet pressure","the total turbine inlet pressure to the total compressor outlet pressure"],"a":0,"t":"teops","fig":null,"s":"turb"},{"id":"20353","page":92,"q":"One of the purposes of compressor bleed valves is to:","o":["increase the airflow across the rear compressor stages, whilst that across the early stages is decreased","limit the acceleration period of the engine","decrease the airflow across the rear compressor stages, whilst that across the early stages is increased","decrease the load on the compressor when the engine is approaching maximum rpm"],"a":2,"t":"tecomp","fig":null,"s":"turb"},{"id":"20354","page":92,"q":"One of the purposes of the bleed valves fitted to axial flow compressors is to:","o":["spill compressor air should the engine overspeed thus controlling the speed","enable an external air supply to spin up the compressor for engine starting","reduce the tendency to compressor stall","control the acceleration time of the engine"],"a":2,"t":"tecomp","fig":null,"s":"turb"},{"id":"20355","page":93,"q":"One reason to fit a tip shroud to a turbine blade is to:","o":["prevent blade creep","provide a seal for the cooling airflow","increase turbine efficiency","reduce turbine temperatures"],"a":2,"t":"teturb","fig":null,"s":"turb"},{"id":"20366","page":93,"q":"Severe compressor stall can be indicated amongst others by:","o":["an increase in engine pressure ratio (EPR) and a decrease in TGT and fuel flow","a rise in turbine gas temperature (TGT) and a change in vibration level","a decrease in TGT and a change in vibration level","a rise in TGT and an increase in fuel flow"],"a":1,"t":"tecomp","fig":null,"s":"turb"},{"id":"20379","page":93,"q":"The by-pass air in a by-pass type gas turbine engine promotes lower specific fuel consumption by causing an overall:","o":["increase in the mean jet temperature and increase in thermal efficiency","decrease in combustion chamber temperature and higher thermal efficiency","increase in exhaust gas flow average velocity thus increasing engine pressure ratio","decrease in exhaust gas flow average velocity and higher propulsive efficiency"],"a":3,"t":"tefan","fig":null,"s":"turb"},{"id":"20400","page":93,"q":"The characteristics of a centrifugal compressor are: 1) a high pressure ratio by stage 2) a large diameter 3) a low pressure ra ":null,"s":"turb"},{"id":"21887","page":93,"q":"The principles underlying the effects of jet propulsion are set out in:","o":["Newtons 1st Law of Motion","Newtons 2nd Law of Motion","Newtons 3rd Law of Motion","Faradays Conservation of Energy Precepts"],"a":2,"t":"tecyc","fig":null,"s":"turb"},{"id":"21888","page":93,"q":"By comparison with an axial flow compressor, a centrifugal compressor is:","o":["Lighter and has a high power to weight ratio","Fuel efficient and has higher thermal efficiencies","More efficient and with a higher compression ratio","More robust and technologically less complicated"],"a":3,"t":"tecomp","fig":null,"s":"turb"},{"id":"21890","page":93,"q":"The ideal situation for maximum supersonic intake efficiency (recovery factor) is known as:","o":["Critical operation","Sub-critical operation","Super critical operation","Sub-sonic pressure recovery factor"],"a":0,"t":"tefan","fig":null,"s":"turb"},{"id":"21891","page":94,"q":"Compressor surge is to do with:","o":["Turbine overspeed which affects compressor output characteristics","Compressor choke, usually at low powers and flow reversal and/or with aircraft unusual attitude situations","Compressor start malfunctions primarily","Combustion chamber overpressure caused by overfuelling only"],"a":1,"t":"tecomp","fig":null,"s":"turb"},{"id":"21894","page":94,"q":"The overall average and combustion air fuel ratios are as follows:","o":["60:1 and 15:1","133:1 for both","15:1 for both","60:1 for both"],"a":0,"t":"teturb","fig":null,"s":"turb"},{"id":"21896","page":94,"q":"Whilst flowing through a turbine blade, gas velocity:","o":["Increases from root to tip","Remains unchanged from root to tip","Reduces from root to tip","Reduces from tip to root"],"a":2,"t":"teturb","fig":null,"s":"turb"},{"id":"21897","page":94,"q":"A gas turbine engine operates in accordance with the:","o":["Modified Brayton cycle","Modified Otto cycle","Brayton cycle","Otto cycle"],"a":2,"t":"tecyc","fig":null,"s":"turb"},{"id":"21898","page":94,"q":"A free turbine is:","o":["Directly connected to a specific axial flow compressor","Always found in centrifugal compressor engines","Connected to an LP compressor and then to the fan","Directly connected to a propeller or gearbox and to nothing else"],"a":3,"t":"teturb","fig":null,"s":"turb"},{"id":"21899","page":94,"q":"A convergent-divergent duct located in a gas turbine exhaust unit:","o":["Allows acceleration of the gas to supersonic speeds in the convergent part of the exhaust unit and then uses the properties of a divergent duct under supersonic flow conditions to continue to accelerate the gas flow to the maximum speed possible","Has no specific function other than to cause a choke in the exhaust unit","Operates on the principle of causing gas velocity to decrease throughout the length of the exhaust unit thus ensuring that the greatest mass flow possible is passed to atmosphere","None of these"],"a":0,"t":"tecyc","fig":null,"s":"turb"},{"id":"21900","page":94,"q":"The propulsive efficiency of a turbo jet is the ratio of:","o":["Propelling nozzle thrust to energy supplied to the nozzle","Nozzle gas flow to intake gas flow","Jet pipe pressure to air intake pressure","Lbs fuel burned to lbs thrust developed"],"a":0,"t":"tefan","fig":null,"s":"turb"},{"id":"21918","page":94,"q":"What is the purpose of the turbine in a turbo-jet?","o":["Drive auxiliary devices","Compress the air coming into the engine","Exhaust burnt gases","Drive the compressor using energy from the exhaust gases"],"a":3,"t":"teturb","fig":null,"s":"turb"},{"id":"21923","page":94,"q":"The self-sustaining speed of a turbine engine is that at which the engine:","o":["Is designed to idle at","Operates most efficiently","Will run without external assistance","Will allow the generators to supply busbar voltage"],"a":2,"t":"teops","fig":null,"s":"turb"},{"id":"21927","page":94,"q":"The flow duct of the axial flow compressor of a turbo-jet engine is tapered so as to:","o":["maintain a constant axial speed in cruising flight","maintain a constant axial speed whatever the engine rating","reduce the axial speed in cruising flight","reduce the axial speed, whatever the engine rating"],"a":0,"t":"tecomp","fig":null,"s":"turb"},{"id":"22148","page":94,"q":"In gas turbine engines maximum gas temperature is attained:","o":["within the combustion chamber","at entry of the exhaust unit","in cooling airflow around the turbine","across the turbine"],"a":0,"t":"teturb","fig":null,"s":"turb"},{"id":"22149","page":94,"q":"For a turbine engine the term 'self sustaining speed' is the speed at which:","o":["the lowest acceptable rpm in flight occurs","the engine will continue to run when the starter is disengaged","the IAS below which flameout will occur","the highest rpm acceptable, above which the rpm will increase uncontrollably"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"22151","page":94,"q":"The fan in high by-pass ratio turbo jet engines produces:","o":["about half the thrust","about a third of the thrust","only a minimal amount of thrust","the greater part of thrust"],"a":3,"t":"tefan","fig":null,"s":"turb"},{"id":"22152","page":95,"q":"A gas turbine engine power change is achieved by:","o":["adjusting the amount of fuel supplied and the amount of air entering the compressor","adjusting the amount of fuel supplied","adjusting the amount of air supplied","adjusting the amount of fuel supplied and the amount of air entering the turbine"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"22156","page":95,"q":"An EPR gauge reading normally shows the ratio of:","o":["compressor outlet pressure to compressor inlet pressure","jet pipe pressure to compressor inlet pressure","turbine inlet pressure to compressor outlet pressure","compressor inlet pressure to turbine outlet pressure"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"22162","page":95,"q":"What happens to air pressure as it passes over the turbine blades known as impulse/reaction blades (1) and to the velocity of the air as it passes over the nozzle guide vanes (2)?","o":["(1) increase; (2) decrease","(1) decrease; (2) increase","(1) stays the same; (2) increase","(1) decrease; (2) stays the same"],"a":1,"t":"teturb","fig":null,"s":"turb"},{"id":"22177","page":95,"q":"EPR is measured by the ratio of:","o":["Turbine pressure to combustion chamber inlet pressure","High pressure compressor inlet pressure to exhaust pressure","Low pressure compressor inlet pressure to high pressure compressor outlet pressure","exhaust pressure to low pressure compressor inlet pressure"],"a":3,"t":"teops","fig":null,"s":"turb"},{"id":"22178","page":95,"q":"Where is EGT measured?","o":["In the jet pipe","HP turbine outlet","HP compressor outlet","Combustion chamber"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"22189","page":95,"q":"How do you control power in a jet engine?","o":["By controlling the mixture ratio","By controlling the fuel flow","By controlling the airflow","By controlling the bleed valves"],"a":1,"t":"teops","fig":null,"s":"turb"},{"id":"22199","page":95,"q":"What is engine pressure ratio?","o":["The ratio of turbine outlet pressure to compressor inlet pressure","The ratio of turbine inlet pressure to compressor inlet pressure","Turbine outlet pressure x compressor outlet pressure","Compressor inlet pressure divided by turbine outlet pressure"],"a":0,"t":"teops","fig":null,"s":"turb"},{"id":"716","page":95,"q":"In a free turbine engine:","o":["its shaft may be connected to either a compressor or another turbine","there is no mechanical connection between the compressor and the power output shaft","the air enters the compressor via the input turbine","the compressor and power output shaft are mechanically connected"],"a":1,"t":"ecturb","fig":null,"s":"ec"},{"id":"726","page":95,"q":"What does a diffuser in a gas turbine do?","o":["Expands the air entering the combustion chamber","Increase the total temperature of the air","Increase the relative velocity of the air entering the combustion chamber","Convert kinetic pressure into static pressure"],"a":3,"t":"ecduct","fig":null,"s":"ec"},{"id":"738","page":95,"q":"The disadvantages of axial flow compressors compared to centrifugal flow compressors are: 1) expensive to manufacture 2) limited airflow 3) greater vulnerability to foreign object damage 4) lower pressure ratio. The combination regrouping all the correct statements is:","o":["2 - 3","1 - 2","1 - 3","2 - 4"],"a":2,"t":"eccomp","fig":null,"s":"ec"},{"id":"6974","page":96,"q":"The diffuser in a centrifugal compressor is a device in which the:","o":["velocity, pressure and temperature rise","pressure rises at a constant velocity","pressure rises and velocity falls","velocity rises and pressure falls"],"a":2,"t":"ecduct","fig":null,"s":"ec"},{"id":"6990","page":96,"q":"Turbine blade stages may be classed as either \"impulse\" or \"reaction\". In an impulse blade section:","o":["the pressure remains constant across the nozzle guide vanes and drops across the rotor blades","the pressure rises across the nozzle guide vanes and remains constant across the rotor blades","the pressure drops across the nozzle guide vanes and remains constant across the rotor blades","the pressure remains constant across the nozzle guide vanes and rises constant across the rotor blades"],"a":2,"t":"ecturb","fig":null,"s":"ec"},{"id":"6998","page":96,"q":"Airflow through a divergent duct causes:","o":["pressure to decrease, velocity to decrease","pressure to decrease, velocity to increase","pressure to increase, velocity to remain constant","pressure to increase, velocity to decrease"],"a":3,"t":"ecduct","fig":null,"s":"ec"},{"id":"7109","page":96,"q":"A \"fan\" stage of a ducted-fan turbine engine is driven by:","o":["the high pressure compressor through reduction gearing","the low pressure turbine","the high pressure turbine","airflow drawn across it by the high pressure compressor"],"a":1,"t":"eccomp","fig":null,"s":"ec"},{"id":"7143","page":96,"q":"The primary reason for a limitation being imposed on the temperature of gas flow in a gas turbine is to:","o":["ensure that the maximum acceptable temperature within the combustion chamber is not exceeded","prevent damage to the jet pipe from overheating","prevent overheating and subsequent creep of the nozzle guide vanes","ensure that the maximum acceptable temperature at the turbine blades is not exceeded"],"a":3,"t":"ecturb","fig":null,"s":"ec"},{"id":"7161","page":96,"q":"In the axial flow compressor of a turbo-jet engine, the flow duct is tapered. Its shape is calculated so as to:","o":["reduce the axial speed in cruising flight","maintain a constant axial speed whatever the engine rating","maintain a constant axial speed in cruising flight","reduce the axial speed, whatever the engine rating"],"a":2,"t":"eccomp","fig":null,"s":"ec"},{"id":"7334","page":96,"q":"In a fan jet engine the bypass ratio is:","o":["internal mass airflow divided by external mass airflow","external mass airflow divided by internal mass airflow","internal mass airflow divided by mass fuel flow","mass fuel flow divided by mass fuel flow"],"a":1,"t":"eccomp","fig":null,"s":"ec"},{"id":"7544","page":96,"q":"What makes the non-rigid fittings of compressor and turbine blades rigid when the engine is running?","o":["Oil pressure","Aerodynamic and Centrifugal force","Aerodynamic force","Centrifugal force"],"a":1,"t":"eccomp","fig":null,"s":"ec"},{"id":"7566","page":96,"q":"A stage in an axial compressor:","o":["is made of row of stator blades followed by a rotor disc","has a compression ratio in the order of 0,8","is made of a rotor disc followed by a row of stator blades","has a compression ratio in the order of 2,1"],"a":2,"t":"eccomp","fig":null,"s":"ec"},{"id":"11990","page":96,"q":"An impulse turbine is a turbine in which the expansion takes place:","o":["fully in the rotor","in the rotor and in the stator","in order to produce a degree of jet propulsion < 1/2","fully at the stator"],"a":3,"t":"ecturb","fig":null,"s":"ec"},{"id":"12004","page":96,"q":"The primary purpose of the bleed valves fitted to axial flow compressors is to:","o":["control the acceleration time of the engine","spill compressor air should the engine overspeed thus controlling the speed","enable an external air supply to spin up the compressor for engine starting","reduce the likelihood of compressor stall"],"a":3,"t":"eccomp","fig":null,"s":"ec"},{"id":"12361","page":96,"q":"PRESSURE RECOVERY within the air intake means that:","o":["As far as is possible, total head pressure is achieved at the compressor face","Total head pressure is achieved at the air intake","Pressure recovery is only applied to bleed valve-operating characteristics","Intake pressures are reduced"],"a":0,"t":"ecduct","fig":null,"s":"ec"},{"id":"12362","page":97,"q":"In a centrifugal compressor, air enters via the:","o":["combustion chamber","eye of the impeller","variable IGV","diffuser"],"a":1,"t":"eccomp","fig":null,"s":"ec"},{"id":"12364","page":97,"q":"A gas turbine blade is usually of the:","o":["Pelton wheel type","Impulse type","Reaction type","Impulse / Reaction type"],"a":3,"t":"ecturb","fig":null,"s":"ec"},{"id":"12365","page":97,"q":"The shape of the exhaust unit is slightly:","o":["Divergent and pressure increases","Convergent and velocity decreases","Convergent","Divergent and pressure decreases"],"a":0,"t":"ecduct","fig":null,"s":"ec"},{"id":"12370","page":97,"q":"The design of a fan or bypass engine spinner is such that:","o":["Rain / Hail can be deflected into the engine core","Rain / Hail can be deflected into the bypass duct","Damage caused by the ingestion of foreign bodies can be minimised","Ice protection is not required"],"a":1,"t":"eccomp","fig":null,"s":"ec"},{"id":"12381","page":97,"q":"Turbine blade efficiency is increased by:","o":["Compressor air bleeds","Filling shrouds","Providing air cooling","The fir-tree method"],"a":1,"t":"ecturb","fig":null,"s":"ec"},{"id":"20201","page":97,"q":"(Refer to figure 021-35) The gas turbine illustrated is of the following type:","o":["single shaft turbine and centrifugal compressor","free turbine and axial compressor","free turbine and centrifugal compressor","single shaft turbine and axial compressor"],"a":2,"t":"ecturb","fig":"021-35","s":"ec"},{"id":"20211","page":97,"q":"A gas turbine engine turbine section may employ active clearance control:","o":["in order to cool the disc","to provide enhanced clearances between the blade tips and the casing","in order to reduce \"creep\" in the blades","as a method of attaching the stators and rotors to the hub of the disc"],"a":1,"t":"ecturb","fig":null,"s":"ec"},{"id":"20270","page":97,"q":"Engine compartment decking and firewalls are manufactured from:","o":["Asbestos blankets","Aluminium alloy sheet","Composite materials such as carbon, kevlar and fibre glass","Stainless steel or titanium sheet"],"a":3,"t":"ecduct","fig":null,"s":"ec"},{"id":"20272","page":97,"q":"Engine temperature limitations are usually imposed due to temperature limitations on the:","o":["casing of the combustion chamber","compressor section","turbine section","jet pipe"],"a":2,"t":"ecturb","fig":null,"s":"ec"},{"id":"20283","page":97,"q":"For a subsonic airflow, in a divergent duct the:","o":["pressure decreases, velocity increases and temperature increases","pressure increases, velocity decreases and temperature increases","pressure increases, velocity decreases and temperature decreases","pressure decreases, velocity increases and temperature decreases"],"a":1,"t":"ecduct","fig":null,"s":"ec"},{"id":"20399","page":97,"q":"The greatest risk created by a free turbine overspeed is:","o":["a surge of the gas generator","bursting of the free turbine disk","creep of the turbine blades","an engine overtemperature"],"a":1,"t":"ecturb","fig":null,"s":"ec"},{"id":"20424","page":97,"q":"The purpose of a compressor bleed valve is to prevent surging:","o":["generated by foreign object ingestion","at low compressor rpm","of the first compressor stages","with altitude"],"a":1,"t":"eccomp","fig":null,"s":"ec"},{"id":"20427","page":97,"q":"The purpose of a variable bypass valve, fitted between the LP and HP compressor of an axial flow compressor, is to:","o":["enable to start the engine with an external air supply","control the acceleration of the engine","prevent the engine from an overspeed","prevent stall in the LP compressor"],"a":3,"t":"eccomp","fig":null,"s":"ec"},{"id":"20481","page":98,"q":"When a gas turbine engine is fitted with can-type combustion chambers:","o":["each chamber is fitted with two igniters","each chamber has its own igniter","each chamber is fitted with one igniter and one glow plug","a total of only two igniters are usually fitted since the chambers are inter-connected"],"a":3,"t":"ecturb","fig":null,"s":"ec"},{"id":"21889","page":98,"q":"By comparison with a single spool axial flow turbo-jet a twin spool engine is:","o":["Mechanically complicated and has an overall lower compression ratio with high turbine inlet temperatures","Much less fuel efficient","Heavier and has a lower power to weight ratio","More flexible in operation, less prone to surge and with higher compression ratios has better overall performance"],"a":3,"t":"eccomp","fig":null,"s":"ec"},{"id":"21892","page":98,"q":"Variable inlet guide vanes and bleed valves are fitted to:","o":["Reschedule the fuel system or operating medium if there is a tendency for the engine to surge","Ensure that the intake mechanism is set for efficient operation at all speeds and power settings, to avoid surge onset","Reduce opportunities for the engine to surge","None of the above"],"a":2,"t":"eccomp","fig":null,"s":"ec"},{"id":"21893","page":98,"q":"A divergent duct (diffuser) in the combustion chamber inlet and in the flame tube:","o":["Ensures the availability of cooling air","Increases air pressure only just prior to combustion","Increases inlet air velocity to a speed suitable for stable combustion","Reduces inlet air velocity to a speed suitable for stable combustion"],"a":3,"t":"ecduct","fig":null,"s":"ec"},{"id":"21895","page":98,"q":"The function of the nozzle guide vanes is to:","o":["Ensure air velocity is at a maximum and the airflow direction is correct prior to entry to the 1st stage compressor blades","Increase the gas velocity (and therefore momentum) to as high a speed as possible and guide the stream at the correct angle onto the turbine blades","Guide the gas stream onto the turbine blades at the best angle possible only","Increase the velocity of the gas to the highest speed possible only"],"a":1,"t":"ecturb","fig":null,"s":"ec"},{"id":"21919","page":98,"q":"When bleed valves are fitted to axial flow compressors, their primary purpose is to:","o":["Provide the engine with additional air at high power settings and low forward speed","Reduce likelihood of compressor stall","Allow engine acceleration to be controlled","Allow an external air supply to spin the compressor for starting purposes"],"a":1,"t":"eccomp","fig":null,"s":"ec"},{"id":"21920","page":98,"q":"A compressor stage is made up of:","o":["A rotor and a stator","A stator and a rotor","Two rotors followed by a stator","Two stators followed by a rotor"],"a":0,"t":"eccomp","fig":null,"s":"ec"},{"id":"21921","page":98,"q":"In an impulse turbine expansion takes place:","o":["In the stator and rotor","Fully in the rotor","Fully in the stator","Only in the last stage of the turbine"],"a":2,"t":"ecturb","fig":null,"s":"ec"},{"id":"21922","page":98,"q":"What is the primary reason for limiting the temperature of the gas flow in a turbine?","o":["To prevent the combustion chamber temperature limit from being exceeded","To prevent damage to the compressor blades","To prevent damage to the exhaust jet pipe","To ensure that turbine blade limiting temperatures are not exceeded"],"a":3,"t":"ecturb","fig":null,"s":"ec"},{"id":"21928","page":98,"q":"A stage in an axial flow compressor:","o":["is made of a rotor disc followed by a row of stator blades","is made of row of stator blades followed by a rotor disc","has a compression ratio in the order of 0.8","has a compression ratio in the order of 2.1"],"a":0,"t":"eccomp","fig":null,"s":"ec"},{"id":"22153","page":98,"q":"High-pressure bleed valves:","o":["reduce the engine pressure ratio","increase the EGT","have no effect on thrust","increase the fuel flow"],"a":0,"t":"eccomp","fig":null,"s":"ec"},{"id":"22157","page":98,"q":"On a single spool axial flow gas turbine engine the compressor rotates:","o":["at the same speed as the turbine","slower than the turbine","faster than the turbine","independent of the turbine"],"a":0,"t":"eccomp","fig":null,"s":"ec"},{"id":"22163","page":99,"q":"The first stage of an axial compressor:","o":["has a compression ratio of about 2:1","comprises a row of stators and a rotor disc","has a compression ratio of about 0.8","comprises a rotor disc followed by a row of stators"],"a":3,"t":"eccomp","fig":null,"s":"ec"},{"id":"22169","page":99,"q":"What are secondary air holes used for in a gas turbine combustion chamber?","o":["to increase power at low altitudes","to increase mass flow at high Mach number cruise speed","to increase engine cooling","to increase the mixture strength"],"a":2,"t":"ecturb","fig":null,"s":"ec"},{"id":"689","page":99,"q":"In a fuel system, the oil to fuel heat exchanger allows:","o":["fuel heating as required whenever fuel filter clogging is detected","fuel cooling so as to prevent vapour creation likely to unprime nozzles","jet engine oil cooling through thermal exchange with fuel flowing from tanks","automatic fuel heating by the engine oil so as to prevent icing in fuel filter"],"a":2,"t":"eslub","fig":null,"s":"es"},{"id":"2747","page":99,"q":"The oil system for a piston engine incorporates an oil cooler that is fitted:","o":["in the return line to the oil tank after the oil has passed through the scavenge pump","between the oil tank and the pressure pump","after the pressure pump but before the oil passes through the engine","after the oil has passed through the engine and before it enters the sump"],"a":0,"t":"eslub","fig":null,"s":"es"},{"id":"2758","page":99,"q":"In very cold weather, the pilot notices during startup, a slightly higher than normal oil pressure. This higher pressure:","o":["is normal, if it decreases after startup","is abnormal and requires the engine to be shut down","is abnormal but does not require the engine to be shut down","requires an oil change"],"a":0,"t":"eslub","fig":null,"s":"es"},{"id":"6517","page":99,"q":"The reason for having a low pressure fuel-cooled oil cooler in a recirculatory type oil system is to:","o":["cool both the oil and the fuel","cool the oil only","cool the oil and heat the fuel","heat the fuel only"],"a":2,"t":"eslub","fig":null,"s":"es"},{"id":"6529","page":99,"q":"The accessory units driven by the accessory gearbox of a turbo-jet engine are the: 1) tacho-generator N1 2) tacho-generator N2 3) thrust reverser pneumatic motors 4) AC generator and its Constant Speed Unit (CSD) 5) oil pumps 6) hydraulic pumps 7) high pressure fuel pumps. The combination regrouping all the correct statements is:","o":["4, 5, 6, 7","2, 3, 4, 5, 6, 7","2, 4, 5, 6","1, 4, 5, 6, 7"],"a":3,"t":"esacc","fig":null,"s":"es"},{"id":"7042","page":99,"q":"A fuel strainer when fitted to a carburettor will be positioned:","o":["between the metering jet and the discharge nozzle","between the needle valve and the metering jet","upstream of the needle valve","downstream of the discharge nozzle"],"a":2,"t":"esstart","fig":null,"s":"es"},{"id":"7115","page":99,"q":"Reverse thrust lights come on when:","o":["reverser doors are unlocked","when reverse power above idle is selected","when reverse thrust is selected in flight","when the doors move towards the stowed position inadvertently"],"a":0,"t":"esrev","fig":null,"s":"es"},{"id":"7172","page":100,"q":"The use of igniters is necessary on a turbo-jet: 1) throughout the operating range of the engine 2) for accelerations 3) for ground starts 4) for in-flight relights 5) during turbulence in flight 6) under heavy precipitation or in icing conditions. The combination which regroups all of the correct statements is:","o":["3 - 4 - 5 - 6","3","2 - 3 - 4","1"],"a":0,"t":"esstart","fig":null,"s":"es"},{"id":"7174","page":100,"q":"When does the engine High Pressure fuel shut off valve close?","o":["After a booster pump failure","When the engine fuel switch is selected 'on' during engine start","When flight idle is selected","When the engine fuel switch is selected 'off' during engine shut-down"],"a":3,"t":"esstart","fig":null,"s":"es"},{"id":"7302","page":100,"q":"What is the purpose of the FCOC (Fuel Cooled Oil Cooler)?","o":["To maintain the oil at the correct temperature","To heat the fuel and cool the oil","To heat the oil and cool the fuel","To by-pass oil to the engine if the oil pressure filter becomes blocked"],"a":1,"t":"eslub","fig":null,"s":"es"},{"id":"7313","page":100,"q":"Using compressor bleed air to power systems:","o":["increases aircraft performance","has no influence on aircraft performance","decreases aircraft performance","is limited to the phases of take-off and landing"],"a":2,"t":"esacc","fig":null,"s":"es"},{"id":"7558","page":100,"q":"A reverse thrust door warning light on the flight deck instrument panel illuminates when:","o":["the reverser doors are locked","reverse has been selected but the doors have remained locked","the reverser doors have moved to the reverse thrust position","the reverser doors are unlocked"],"a":3,"t":"esrev","fig":null,"s":"es"},{"id":"11993","page":100,"q":"Consider the variable-pitch propeller of a turbo-prop aircraft. During deceleration:","o":["when braking, the propeller supplies negative thrust and absorbs engine power","at zero power, the propeller thrust is zero and the engine power absorbed is nil","when feathered, the propeller produces thrust and absorbs no engine power","with propeller windmilling, the thrust is zero and the propeller supplies engine power"],"a":0,"t":"esacc","fig":null,"s":"es"},{"id":"12007","page":100,"q":"Immediately after starting engine(s) with no other electrical services switched on, an ammeter is showing a high charge rate to the battery.","o":["indicates a faulty reverse current relay","would be normal and is only cause for concern if the high charge rate persists","indicates a battery failure since there should be no immediate charge","indicates a generator failure, thus requiring the engine to be shut down immediately"],"a":1,"t":"esstart","fig":null,"s":"es"},{"id":"12379","page":100,"q":"The air intake of an aircraft with supersonic capability may well have fitted:","o":["A secondary intake for supersonic flight","A spill port for take-off","A secondary intake for take-off and a spill port for supersonic flight","A spill port for use with the afterburner"],"a":2,"t":"esacc","fig":null,"s":"es"},{"id":"12382","page":100,"q":"Clamshell doors are selected and actuated by the following means:","o":["Mechanically and pneumatically respectively","Electrically and electric actuator respectively","Mechanically and hydraulically respectively","Hydraulically and electrical actuator respectively"],"a":0,"t":"esrev","fig":null,"s":"es"},{"id":"12385","page":100,"q":"The usual methods of starting civil aircraft engines are:","o":["AVPIN or compressed air bottles","Electrical starter motor or AVPIN","Air starter motor or starter cartridge","Air starter motor or electrical starter motor"],"a":3,"t":"esstart","fig":null,"s":"es"},{"id":"12387","page":100,"q":"There are two types of oil system:","o":["Total loss and pressure relief types","Total loss and full flow systems","Pressure relief and full flow systems","None of the above"],"a":2,"t":"eslub","fig":null,"s":"es"},{"id":"12389","page":101,"q":"When is ice protection required?","o":["Flying in cloud in a temperature of +15°C","On the ground in ing all the correct statements is:","o":["1, 2, 3","1, 3, 4","2, 3, 4","1, 2, 4"],"a":1,"t":"oxsafe","fig":null,"s":"ox"},{"id":"817","page":111,"q":"An aircraft is scheduled to fly from PARIS to MARSEILLE at FL 390 and has the following characteristics: - Maximum permissible number of passenger specified by the certificate of airworthiness = 230 - Number of seats on board = 200 - Scheduled number of passengers on board = 180. The minimum number of inhaler systems provided in the aircraft cabin should be:","o":["180","230","200","220"],"a":3,"t":"oxreg","fig":null,"s":"ox"},{"id":"819","page":111,"q":"When quick donning masks are in use, the pilot is:","o":["not able to do any radio communication","only able to receive","only able to transmit","able to radiotelephone"],"a":3,"t":"oxcrew","fig":null,"s":"ox"},{"id":"825","page":111,"q":"A public transport jet aeroplane may be operated up to FL 450. The cabin includes 180 passenger seats made up of 30 rows (3 seats from each side of central aisle). The minimum number of cabin oxygen masks for this aeroplane must be:","o":["198 (110% of the seating capacity)","270 (150% of the seating capacity)","240 (one additional mask per seat block)","210 (one additional mask per seat row)"],"a":0,"t":"oxreg","fig":null,"s":"ox"},{"id":"827","page":112,"q":"A jet aircraft is certified for the carriage of 120 passengers. 42 passengers are on board and the expected Flight Level on route Paris-Alger is FL 330. The first aid oxygen to be on board at departure shall provide breathing supply for at least:","o":["1 passenger for the entire flight after cabin depressurisation at cabin altitude of more than 8000 ft","no first aid required","1 passenger for the entire fligth after cabin depressurisation at cabin altitude between 10000 and 14000 ft","3 passengers for the entire flight after cabin depressurisation at cabin altitude between 10000 and 14000 ft"],"a":0,"t":"oxreg","fig":null,"s":"ox"},{"id":"832","page":112,"q":"A passenger emergency mask is a:","o":["an on demand type mask and in principle should not be used if there is smoke in the cabin","a continuous flow mask and in principle should not be used if there is smoke in the cabin","a continuous flow mask and must be used if there is smoke in the cabin","an on demand type mask and must be used if there is smoke in the cabin"],"a":1,"t":"oxpax","fig":null,"s":"ox"},{"id":"847","page":112,"q":"If the maximum operating pressure of the oxygen system is exceeded the:","o":["oxygen is discharged overboard via a safety plug","oxygen becomes unusable for the passengers","passenger oxygen masks will drop down","oxygen bottles will explode"],"a":0,"t":"oxsafe","fig":null,"s":"ox"},{"id":"853","page":112,"q":"Consider the flight deck oxygen supply system. The purpose of the oxygen regulator (as a function of demand and altitude) is to: 1. decrease oxygen pressure from 1800 PSI (in the bottles) down to about 50-75 PSI (low pressure system) 2. supply pure oxygen 3. supply diluted oxygen 4. supply oxygen at normal pressure 5. supply oxygen at emergency/positive pressure 6. trigger the continuous cabin altitude warning at 10000 ft cabin altitude. The combination regrouping all the correct statements is:","o":["2, 3, 4, 5","3, 4, 5, 6","1, 2, 3, 4","1, 3, 4, 6"],"a":0,"t":"oxcrew","fig":null,"s":"ox"},{"id":"854","page":112,"q":"Airliners are equipped with oxygen systems. It can be said that:","o":["with setting on \"NORMAL\", the crew breathes a mixture of oxygen / cabin air","the same circuit is used by the crew and the passengers","the seals must be carefully greased to avoid sparks","the passenger circuit never uses chemically generated oxygen"],"a":0,"t":"oxsafe","fig":null,"s":"ox"},{"id":"859","page":112,"q":"In accordance with JAR-OPS 1, during and following an emergency descent, each occupant of the cockpit seats on duty must have access to a minimum amount of oxygen in: 1) order to maintain a supply throughout the entire flight time where the cabi :"ox"},{"id":"7376","page":113,"q":"The purpose of the \"Pressure Relief Valve\" in a high pressure oxygen system is to:","o":["act as a manual shut-off valve","reduce pressure in the oxygen reservoir to a suitable manifold pressure for the regulator","relieve overpressure if the pressure reducing valve malfunctions","maximize the charging pressure of the system"],"a":2,"t":"oxsafe","fig":null,"s":"ox"},{"id":"7377","page":113,"q":"A substance which may never be used in the vicinity or on parts of an oxygen installation is:","o":["Halon","Water","Grease","Nitrogen"],"a":2,"t":"oxsafe","fig":null,"s":"ox"},{"id":"7382","page":113,"q":"The passenger oxygen mask will supply:","o":["Cabin air and oxygen","100% oxygen","Cabin air and oxygen or 100% oxygen","A mixture of oxygen and freon gas"],"a":0,"t":"oxpax","fig":null,"s":"ox"},{"id":"7385","page":113,"q":"In accordance with JAR-OPS 1, when an airplane flies at over 25000 ft, the total number of oxygen dispensing units and supply terminals must be at least greater than the number of:","o":["seats by 30 %","passengers by 10 %","seats by 10 %","passengers by 30%"],"a":2,"t":"oxreg","fig":null,"s":"ox"},{"id":"7394","page":113,"q":"The chemical oxygen generator supplies oxygen for about:","o":["5 minutes","30 minutes","2 hours","15 minutes"],"a":3,"t":"oxpax","fig":null,"s":"ox"},{"id":"7398","page":113,"q":"The demand valve of a diluter-demand type oxygen regulator in normal mode, operates when the:","o":["pressure in the oxygen reservoir is more than 500 psi","diluter control is in normal position","user requires 100 percent oxygen","user breathes in"],"a":3,"t":"oxcrew","fig":null,"s":"ox"},{"id":"7399","page":113,"q":"An aircraft is to fly at 29 000 ft. When should the oxygen briefing take place?","o":["before reaching 10000ft","before reaching 14000ft","at 20000ft","before take-off"],"a":3,"t":"oxreg","fig":null,"s":"ox"},{"id":"7409","page":113,"q":"At what height is it mandatory for one of the flight deck crew to
