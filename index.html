<style>
/* Layout: sticky instrument strip (progress) over a single reading column of question cards; controls sit in one panel above the list. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --sunk: #f5f7fa;
  --ink: #132034;
  --muted: #5a6678;
  --line: #d6dce5;
  --scrim: rgba(19, 32, 52, .45);
  --accent: #1d5bbf;
  --accent-soft: #e3ecfa;
  --ok: #18794e;
  --ok-soft: #e2f4ea;
  --bad: #b42318;
  --bad-soft: #fbe7e5;
  --amber: #a8620a;
  --t0: #1d5bbf;
  --t1: #0e7c76;
  --t2: #6a4bc4;
  --t3: #b0306f;
  --t4: #8a6d00;
  --t5: #5f7a1f;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131b; --surface: #151e29; --sunk: #111923; --ink: #e5eaf1; --muted: #93a0b2; --line: #253141; --scrim: rgba(0, 0, 0, .6);
    --accent: #75a9ff; --accent-soft: #1a2c47; --ok: #4cc38a; --ok-soft: #12301f; --bad: #ff8277; --bad-soft: #3a1714;
    --amber: #f0b44c; --t0: #75a9ff; --t1: #43c6bd; --t2: #a993f5; --t3: #f07ab4; --t4: #d9b84a; --t5: #a9c95a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131b; --surface: #151e29; --sunk: #111923; --ink: #e5eaf1; --muted: #93a0b2; --line: #253141; --scrim: rgba(0, 0, 0, .6);
  --accent: #75a9ff; --accent-soft: #1a2c47; --ok: #4cc38a; --ok-soft: #12301f; --bad: #ff8277; --bad-soft: #3a1714;
  --amber: #f0b44c; --t0: #75a9ff; --t1: #43c6bd; --t2: #a993f5; --t3: #f07ab4; --t4: #d9b84a; --t5: #a9c95a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Sticky strip */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.strip .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 260px; }
.brand .code { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 4px; letter-spacing: .02em; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.15; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.readout { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.readout div { display: grid; line-height: 1.1; }
.readout b { font-family: var(--display); font-size: 22px; font-weight: 600; }
.readout span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.readout .bad b { color: var(--bad); }
.bar { flex-basis: 100%; height: 6px; border-radius: 3px; background: var(--sunk); display: flex; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; transition: width .3s; }
.bar .g { background: var(--ok); } .bar .r { background: var(--bad); }

/* Controls */
main { padding-block: 20px 120px; display: grid; gap: 16px; }
main.wide { max-width: none; padding-right: calc(264px + 48px + max(16px, env(safe-area-inset-right, 0px))); }
/* Session view: cards centred in the space left of a question map pinned to the screen's right edge */
.sess-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.sess-main { display: grid; gap: 16px; min-width: 0; width: 100%; max-width: 980px; margin-inline: auto; }
.qnav { position: fixed; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); width: 264px; top: calc(var(--strip-h, 80px) + env(safe-area-inset-top, 0px) + 20px); max-height: calc(100vh - var(--strip-h, 80px) - var(--dock-h, 0px) - env(safe-area-inset-top, 0px) - 40px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; }
.qnav h3 { margin: 0; font-family: var(--display); font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; align-items: baseline; }
.qnav h3 span { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; text-transform: none; }
.qnav-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }
.qnav-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); background: var(--sunk); }
.qnav-legend i.right { background: color-mix(in srgb, var(--ok) 32%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 70%, var(--surface)); } .qnav-legend i.wrong { background: color-mix(in srgb, var(--bad) 30%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 65%, var(--surface)); }
.qnav-legend i.picked { background: var(--accent); border-color: var(--accent); } .qnav-legend i.flg { background: var(--amber); border-color: var(--amber); border-radius: 50%; width: 7px; height: 7px; vertical-align: 1px; }
.qnav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; overflow-y: auto; align-content: start; padding: 2px; }
.qbox { position: relative; height: 30px; padding: 0; border: 1px solid var(--line); background: var(--sunk); border-radius: 5px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qbox:hover { border-color: var(--muted); color: var(--ink); }
.qbox.right { background: color-mix(in srgb, var(--ok) 32%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 70%, var(--surface)); color: var(--ink); font-weight: 500; }
.qbox.wrong { background: color-mix(in srgb, var(--bad) 30%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 65%, var(--surface)); color: var(--ink); font-weight: 500; }
.qbox.picked { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.qbox.flg::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 1px var(--surface); }
.card { scroll-margin-top: calc(var(--strip-h, 80px) + env(safe-area-inset-top, 0px) + 16px); }
.card.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
.qnav-close, .qnav-toggle { display: none; }
@media (max-width: 1000px) {
  main.wide { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sess-layout { grid-template-columns: minmax(0, 1fr); }
  /* Narrow screens: the map opens as a panel from a floating button above the bottom bar */
  .qnav { top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto;
    bottom: calc(max(var(--dock-h, 0px), env(safe-area-inset-bottom, 0px)) + 76px); max-height: min(60vh, 460px); z-index: 8; box-shadow: 0 12px 40px rgba(0, 0, 0, .28); }
  .qnav:not(.open) { display: none; }
  .qnav-close { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-left: 8px; border: 1px solid var(--line); background: var(--sunk); border-radius: 6px; font-size: 16px; line-height: 1; color: var(--ink); }
  .qnav-grid { grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); }
  .qbox { height: 34px; }
  .qnav-toggle { display: inline-flex; align-items: center; gap: 8px; position: fixed; z-index: 7; right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(max(var(--dock-h, 0px), env(safe-area-inset-bottom, 0px)) + 16px); padding: 10px 14px; border-radius: 999px; border: 1px solid var(--accent);
    background: var(--surface); color: var(--accent); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
  .qnav-toggle[hidden] { display: none; }
  .qnav-toggle svg { width: 16px; height: 16px; }
  .qnav-toggle[aria-expanded="true"] { background: var(--accent); color: var(--surface); }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); min-width: 64px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 14px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip[aria-pressed="true"] .n { color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.search { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 7px 12px; }
select { border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 7px 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn .n { font-family: var(--mono); font-size: 12px; margin-left: 4px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.spacer { flex: 1; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }

/* Result banner */
.result { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; }
.result .score { font-family: var(--display); font-size: 48px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.result .verdict { font-family: var(--display); font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 3px 12px; border-radius: 6px; }
.verdict.pass { color: var(--ok); background: var(--ok-soft); } .verdict.fail { color: var(--bad); background: var(--bad-soft); }
.result p { margin: 0; color: var(--muted); font-size: 14px; }

/* Cards */
.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qno { font-family: var(--display); font-weight: 700; font-size: 18px; }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; }
.tc0 { color: var(--t0); } .tc1 { color: var(--t1); } .tc2 { color: var(--t2); } .tc3 { color: var(--t3); } .tc4 { color: var(--t4); } .tc5 { color: var(--t5); }
.dot.tc0 { background: var(--t0); } .dot.tc1 { background: var(--t1); } .dot.tc2 { background: var(--t2); } .dot.tc3 { background: var(--t3); } .dot.tc4 { background: var(--t4); } .dot.tc5 { background: var(--t5); }
.card-acts { margin-left: auto; display: flex; gap: 6px; }
.flag, .notebtn { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 6px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.flag svg, .notebtn svg { width: 15px; height: 15px; }
.notebtn { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 6px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.notebtn.has { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.modal-back { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.modal { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
.modal h3 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.modal .note-q { margin: 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.modal textarea { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 8px; padding: 10px 12px; font: inherit; line-height: 1.5; }
.modal textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.flag[aria-pressed="true"] { color: var(--amber); border-color: var(--amber); }
.qtext { margin: 0; font-size: 17px; font-weight: 500; max-width: 70ch; }
.fignote { margin: 0; font-size: 13px; color: var(--amber); }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.opt { width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 9px 12px; line-height: 1.4; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); }
.opt .tx { min-width: 0; padding-top: 1px; }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.picked .k { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.dim { opacity: .62; }
.fb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; font-weight: 600; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); } .fb.skip { color: var(--amber); }
.link { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; font-weight: 500; font-size: 14px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }

/* Exam dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 12px; }
.dock .count { font-variant-numeric: tabular-nums; font-weight: 600; }
.dock .warn { color: var(--amber); font-size: 14px; }

.m-only { display: none; }
@media (max-width: 640px) {
  .tablewrap { overflow: visible; margin: 0; }
  .tablewrap table, .tablewrap thead, .tablewrap tbody, .tablewrap th, .tablewrap td { display: block; }
  .tablewrap thead tr { display: flex; }
  .tablewrap thead th:not(:first-child) { display: none; }
  .tablewrap th { padding: 4px 0 8px; border-bottom: 1px solid var(--line); width: 100%; }
  .m-only { display: inline; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); }
  .tablewrap tbody tr { display: grid; grid-template-columns: 22px auto repeat(3, minmax(0, 1fr)); gap: 6px 10px; padding: 12px 6px; border-bottom: 1px solid var(--line); align-items: start; }
  .tablewrap td { border: 0; padding: 0; background: none; }
  tr.on { background: var(--accent-soft); }
  .tablewrap td:nth-child(1) { grid-area: 1 / 1 / 4 / 2; padding-top: 2px; }
  .tablewrap td.sn { grid-area: 1 / 2; }
  .tablewrap td:nth-child(3) { grid-area: 1 / 3 / 2 / 6; }
  .tablewrap td:nth-child(4) { grid-area: 2 / 2 / 3 / 4; }
  .tablewrap td:nth-child(5) { grid-area: 2 / 4; }
  .tablewrap td:nth-child(6) { grid-area: 2 / 5; }
  .tablewrap td.num { text-align: left; }
  .tablewrap td.num::before { content: attr(data-label); display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .tablewrap td.acts { grid-area: 3 / 2 / 4 / 6; text-align: left; white-space: normal; display: flex; flex-wrap: wrap; gap: 6px; }
}
@media (max-width: 560px) {
  .readout { gap: 14px; }
  .label { flex-basis: 100%; }
  .qtext { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
/* Setup + session history */
.panel h2 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.resume { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 500; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.summary { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); }
.msg { margin: 0; font-size: 14px; font-weight: 500; color: var(--ok); }
.msg.err { color: var(--bad); }
.warnline { margin: 0; font-size: 14px; color: var(--amber); font-weight: 500; }
.tablewrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.on td { background: var(--accent-soft); }
td.sn { font-family: var(--display); font-weight: 700; font-size: 16px; white-space: nowrap; }
td .sub { display: block; font-size: 12px; color: var(--muted); }
td.num { text-align: right; white-space: nowrap; }
td.bad { color: var(--bad); font-weight: 600; } td.amb { color: var(--amber); font-weight: 600; }
td.acts { white-space: nowrap; text-align: right; }
td.acts .btn { padding: 4px 10px; font-size: 13px; }
.tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 1px 7px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line); color: var(--muted); }
.tag.live { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.hist { font-size: 12px; color: var(--muted); }
.hist .w { color: var(--bad); } .hist .f { color: var(--amber); }
.sessmeta { font-size: 14px; color: var(--muted); }
.subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.subj { text-align: left; border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.subj:hover { border-color: var(--muted); }
