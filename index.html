<script>
const Q = [{"id":"22014","q":"If the discharge valves fail closed in flight the effect will be:","o":["to potentially damage the aircraft skin","the cabin pressure will rise to maximum differential pressure","the airflow will cease automatically","the cabin altitude will increase"],"a":1,"t":"pr","page":20,"fig":null,"s":"air"},{"id":"7","q":"Under normal conditions (JAR 25) the cabin pressure altitude is not allowed to exceed:","o":["8,000 ft","4,000 ft","6,000 ft","10,000 ft"],"a":0,"t":"pr","page":20,"fig":null,"s":"air"},{"id":"84","q":"Cabin pressurisation is regulated by the:","o":["The engine's bleed valve(s)","The cabin inlet valve(s)","The engine's RPM","The cabin outflow valve(s)"],"a":3,"t":"pr","page":20,"fig":null,"s":"air"},{"id":"86","q":"In a bootstrap cooling system the supply air is first:","o":["passed across an expansion turbine, then compressed and passed through a heat exchanger","compressed, then goes through a heat exchanger and across an expansion turbine","passed across an expansion turbine, then directly to the heat exchanger","compressed, then passed across an expansion turbine through a heat exchanger"],"a":1,"t":"ac","page":20,"fig":null,"s":"air"},{"id":"91","q":"If the cabin altitude rises (aircraft in level flight), the differential pressure:","o":["may exceed the maximum permitted differential unless immediate preventative action is taken","increases","remains constant","decreases"],"a":3,"t":"pr","page":20,"fig":null,"s":"air"},{"id":"2730","page":21,"q":"Assuming cabin differential pressure has reached the required value in normal flight conditions, if flight altitude and air conditioning system setting are maintained:","o":["the mass air flow through the cabin is constant","the outflow valves will move to the fully open position","the pressurisation system ceases to function until leakage reduces the pressure","the outflow valves will move to the fully closed position"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"2731","page":21,"q":"On most modern airliners the cabin pressure is controlled by regulating the:","o":["Airflow leaving the cabin","Airflow entering the cabin","RPM of the engine","Bleed air valve"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"2732","page":21,"q":"In a cabin air conditioning system, equipped with a bootstrap, the mass air flow is routed via the:","o":["turbine outlet of the cold air unit to the primary heat exchanger inlet","compressor outlet of the cold air unit to the primary heat exchanger inlet","secondary heat exchanger outlet to the turbine inlet of the cold air unit","secondary heat exchanger outlet to the compressor inlet of the cold air unit"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"4282","page":21,"q":"If the pressure in the cabin tends to become lower than the outside ambient air pressure the:","o":["negative pressure relief valve will open","negative pressure relief valve will close","outflow valve open completely","air cycle machine will stop"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"4377","page":21,"q":"The cabin rate of descent is:","o":["always the same as the airplane's rate of descent","a cabin pressure increase","a cabin pressure decrease","is not possible at constant airplane altitudes"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4378","page":21,"q":"If the maximum operating altitude of an airplane is limited by the pressurized cabin, this limitation is due to the maximum:","o":["Negative differential pressure at maximum cabin altitude","Positive cabin differential pressure at maximum cabin altitude","Positive cabin differential pressure at maximum operating ceiling","Negative cabin differential pressure at maximum operating ceiling"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4396","page":21,"q":"The term BOOTSTRAP when used to identify a cabin air conditioning and pressurisation system, refers to the:","o":["source of the charge air","cold air unit (air cycle machine) arrangement","means by which pressurisation is controlled","charge air across the inter-cooler heat exchanger"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"4405","page":21,"q":"In the air cycle system the air is cooled down by expansion:","o":["in the turbine","in a pressure relief valve","of Freon in a heat exchanger","of Freon in the turbine"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"4423","page":21,"q":"The pack cooling fan provides:","o":["cooling air to the primary and secondary heat exchanger during cruise","cooling air to the pre-cooler","air to the eyeball outlets at the Passenger Service Unit (PSU)","cooling air to the primary and secondary heat exchanger during slow flight and ground operation"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"4435","page":21,"q":"During level flight at a constant cabin pressure altitude (which could be decreased, even at this flight level), the cabin outflow valves are:","o":["At the pre-set position for take-off","fully closed until the cabin climbs to a selected altitude","Partially open","Fully closed until the cabin descends to a selected altitude"],"a":2,"t":"pr","fig":null,"s":"air"},{"id":"4464","page":21,"q":"A warning device alerts the crew in case of an excessive cabin altitude. This warning must be triggered on reaching the following altitude:","o":["14000 ft (approx. 4200 m)","10000 ft (approx. 3000 m)","8000 ft (approx. 2400 m)","12000 ft (approx. 3600 m)"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4465","page":21,"q":"On a modern large pressurized transport aircraft, the maximum cabin differential pressure is approximately:","o":["22 psi","3 - 5 psi","13 - 15 psi","7 - 9 psi"],"a":3,"t":"pr","fig":null,"s":"air"},{"id":"4485","page":22,"q":"The maximum cabin differential pressure of a pressurised aeroplane operating at FL370 is approximately:","o":["15.5 psi","3.5 psi","13.5 psi","9.0 psi"],"a":3,"t":"pr","fig":null,"s":"air"},{"id":"4486","page":22,"q":"The anti-ice or de-icing system which is mostly used for the wings of modern turboprop aeroplanes is:","o":["Fluid de-icing","Electrical heating","Thermal anti-icing","Pneumatic boots"],"a":3,"t":"ice","fig":null,"s":"air"},{"id":"4502","page":22,"q":"An aircraft with a pressurized cabin is settled at its cruise level. During the flight, a malfunction of the pressure controller is detected by the crew and the cabin rate of climb indicator reads -200 ft/min. Given that: DELTA P = Differential pressure; Zc = Cabin altitude","o":["A descent must be initiated to prevent the oxygen masks dropping when Zc reaches 14000 ft","DELTA P will rise up to its maximum value, thus causing the safety relief valves to open","The aircraft has to climb to a higher flight level in order to reduce Zc to its initial value","The crew has to intermittently cut off the incoming air flow in order to maintain a zero Zc"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4530","page":22,"q":"The advantages of thermal anti-icing are: 1) Simple and reliable system 2) Profiles maintained 3) Greater efficiency than that of an electrical resistor 4) Direct use of the hot air from the jet engine without substantial reduction in engine thrust. The combination of correct statements is:","o":["1, 2","3, 4","1, 3","2, 4"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"4608","page":22,"q":"A turbo-fan cold air unit will:","o":["decrease charge air pressure whilst causing the temperature to rise in the heat exchanger","not affect the charge air pressure","increase charge air pressure whilst causing the temperature to drop in the heat exchanger","cause a pressure drop as well as an associated temperature drop in the charge air"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"4654","page":22,"q":"The purpose of a ditching control is to:","o":["achieve rapid depressurisation","close the outflow valve(s)","open the outflow valve(s)","direct pressurisation air to the flotation bags"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4680","page":22,"q":"A turbo compressor air conditioning system (bootstrap system) includes two heat exchangers; the primary exchanger (P) and the secondary exchanger (S). The functions of these heat exchangers are as follows:","o":["P: warms up engine bleed air; S: recirculates the cabin air, reducing its temperature","P: precools the engine bleed air; S: cools air behind the pack's compressor","P: warms up engine bleed air; S: increases the temperature of air originating from the compressor of the pack","P: pre-cools the engine bleed air; S: increases the temperature of the air used for air-conditioning of cargo compartment (animals)"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"4683","page":22,"q":"A pneumatic de-ice system should be operated:","o":["When there is approximately 1.5 cm of ice on leading edges","When entering areas with icing conditions","When there are approximately 5 cm of ice on leading edges","Only at take-off and during approach"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"4703","page":22,"q":"In a bootstrap system, the purpose of the heat exchangers is to:","o":["allow a homogeneous temperature by mixing air flows from various air conditioning groups in operation","cool bleed air and compressor air from the turbo refrigerator","cool bleed air","allow a steady compressor outlet temperature"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"4714","page":22,"q":"In an air cycle type air conditioning system, reduction of air temperature and pressure is achieved by:","o":["an evaporator","a compressor","a condenser","an expansion turbine"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"4719","page":22,"q":"Cabin altitude means the:","o":["cabin pressure expressed as altitude","difference in height between the cabin floor and ceiling","flight level the aircraft is flying at","flight level altitude at maximum differential pressure"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"4725","page":23,"q":"Engine bleed air used for air conditioning and pressurization in turbo-jet aeroplanes is usually taken from the:","o":["by-pass ducting","fan section","turbine section","compressor section"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"4728","page":23,"q":"The cabin pressure is regulated by the:","o":["Air cycle machine","Outflow valve","Air conditioning pack","Cabin inlet airflow valve"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4743","page":23,"q":"During flight, the wing anti-ice system has to protect:","o":["leading edges, slats and the leading edge flaps","the whole upper wing surface and the flaps","slats and the leading edge flaps only","leading edges only"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"4763","page":23,"q":"With regard to pneumatic mechanical devices that afford ice protection the only correct statement is:","o":["They can only be used as de-icing devices","They are used extensively on modern aircraft as they are inexpensive and easy to maintain","They can only be used as anti-icing devices","They can be used as both de-icing and anti-icing devices"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"4770","page":23,"q":"Cabin differential pressure is the pressure difference between:","o":["local ambient pressure and mean sea level pressure","ISA conditions and aircraft altitude","cabin pressure and ambient pressure","8,000 ft pressure altitude and cabin pressure"],"a":2,"t":"pr","fig":null,"s":"air"},{"id":"4774","page":23,"q":"Environmental system: in the air refrigeration unit, the water separation unit is placed:","o":["after the cooling turbine","before the heat exchangers","before the cooling turbine","just after the heat exchangers"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"4782","page":23,"q":"In the pneumatic supply system of a modern transport aircraft, the air pressure is regulated. This pressure regulation occurs just before the manifold by the:","o":["high pressure bleed air valve","low pressure bleed air valve","fan bleed air valve","intermediate pressure check-valve"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"4790","page":23,"q":"Cabin air for modern airplanes is usually taken from:","o":["the low pressure compressor","the second fan stage","the low pressure compressor and from the high pressure compressor if necessary","the high pressure compressor"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"4796","page":23,"q":"Assuming cabin differential pressure has attained the required value in normal flight conditions, if flight altitude is maintained:","o":["the outflow valves will move to the fully closed position","the outflow valves will move to the fully open position","the pressurisation system ceases to function until leakage reduces the pressure","a constant mass air flow is permitted through the cabin"],"a":3,"t":"pr","fig":null,"s":"air"},{"id":"4797","page":23,"q":"The function of an air cycle machine is to:","o":["remove the water from the bleed air","decrease the pressure of the bleed air","cool the bleed air","pump the conditioned air into the cabin"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"4798","page":23,"q":"In jet aeroplanes the 'thermal anti-ice system' is primarily supplied by:","o":["bleed air from the engines","turbo compressors","ram air, heated via a heat exchanger","the APU"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"4799","page":23,"q":"Main cabin temperature is:","o":["controlled automatically, or by flight crew selection","controlled by individual passenger","not controllable at the maximum cabin differential pressure","only controllable at maximum cabin differential pressure"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"4800","page":23,"q":"In flight, the most commonly used anti-icing method for the wings of modern commercial aircraft fitted with turbo-jet units is:","o":["Mechanical (pneumatic source which acts by deforming the profiles of the leading edge)","Physical/chemical (glycol-based liquid)","Electrical (electrical resistances)","Thermal (use of hot air)"],"a":3,"t":"ice","fig":null,"s":"air"},{"id":"4808","page":24,"q":"An aircraft with a pressurized cabin flies at level 310. Following a malfunction of the pressure controller, the outflow valve runs to the open position. Given: VZc = Cabin rate of climb indication; Zc = Cabin pressure altitude; DELTA P = Differential pressure. This will result in a:","o":["VZc increase, Zc increase, DELTA P increase","VZc decrease, Zc increase, DELTA P decrease","VZc increase, Zc increase, DELTA P decrease","VZc decrease, Zc decrease, DELTA P increase"],"a":2,"t":"pr","fig":null,"s":"air"},{"id":"4818","page":24,"q":"The \"cabin differential pressure\" is:","o":["the pressure differential between the air entering and leaving the cabin","approximately 5 psi at maximum","approximately 15 psi at maximum","cabin pressure minus ambient pressure"],"a":3,"t":"pr","fig":null,"s":"air"},{"id":"4822","page":24,"q":"What controls cabin pressurisation?","o":["ECS pack mass flow controller","Outflow valve","Engine bleed valve","Inflow valve"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4833","page":24,"q":"In a vapour cycle cooling system what is the purpose of the condenser?","o":["To remove moisture from the air by centrifugal action","To convert the refrigerant from a liquid to a gas","To convert the refrigerant from a gas to a liquid","To raise the pressure of the gas to allow efficient cooling"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"4844","page":24,"q":"The ice protection system currently used for the most modern jet aeroplanes is the:","o":["Liquid de-ice system","Electrical de-icing system","Hot air system","Pneumatic system with expandable boots"],"a":2,"t":"ice","fig":null,"s":"air"},{"id":"4883","page":24,"q":"What is the purpose of the pack cooling fans in the air conditioning system?","o":["Supplying the heat exchangers with cooling air during cruise flight","Supplying the Passenger Service Unit (PSU) with fresh air","Cooling of the APU compartment","Supplying the heat exchangers with cooling air during slow flights and ground operation"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"4885","page":24,"q":"The cabin heating supply in a heavy jet transport aircraft is obtained from:","o":["an electrical heater system","a fuel heater system","hot air coming from the engine's turbines","hot air coming from the engine's compressors"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"4890","page":24,"q":"Cabin differential pressure means the pressure difference between:","o":["actual cabin pressure and selected pressure","cabin pressure and ambient air pressure","cockpit and passenger cabin","cabin pressure and ambient air pressure at MSL"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4892","page":24,"q":"During a normal pressurised climb after take-off:","o":["the pressurization system is inoperative until an altitude of 10000 ft is reached","the cabin differential pressure is maintained constant","absolute cabin pressure increases to compensate for fall in pressure outside the aircraft","cabin pressure decreases more slowly than atmospheric pressure"],"a":3,"t":"pr","fig":null,"s":"air"},{"id":"4897","page":24,"q":"Assuming cabin pressure decreases, the cabin rate of climb indicator should indicate:","o":["a rate of descent dependent upon the cabin differential pressure","a rate of climb","a rate of descent of approximately 300 feet per minute","zero"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4899","page":24,"q":"(Refer to figure 021-42) In a pressurized aircraft whose cabin altitude is 8000 ft, a crack in a cabin window makes it necessary to reduce the differential pressure to 5 psi. The flight level to be maintained in order to keep the same cabin altitude is:","o":["FL 230","FL 340","FL 280","FL 180"],"a":0,"t":"pr","fig":"021-42","s":"air"},{"id":"4906","page":25,"q":"Concerning the sequential pneumatic impulses used in certain leading edge de-icing devices, one can affirm that: 1) They prevent ice formation 2) They are triggered from the flight deck after icing has become visible 3) A cycle lasts more than ten seconds 4) There are more than ten cycles per second. The combination which regroups all the correct statements is:","o":["2 - 4","2 - 3","1 - 3","1 - 4"],"a":1,"t":"ice","fig":null,"s":"air"},{"id":"4907","page":25,"q":"When air is compressed for pressurization purposes, the percentage oxygen content is:","o":["unaffected","increased","decreased","dependent on the degree of pressurization"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"4915","page":25,"q":"Assume that during cruise flight with air conditioning packs ON, the outflow valve(s) would close. The result would be that:","o":["the pressure differential would go to the maximum value","the cabin pressure would become equal to the ambient outside air pressure","the skin of the cabin would be overstressed","the air supply would automatically be stopped"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"4926","page":25,"q":"If an aircraft suffers a decompression what happens to the indications on a cabin VSI, cabin altimeter and differential pressure gauge?","o":["VSI up, altimeter up, differential pressure gauge down","VSI, altimeter, differential pressure gauge all unchanged","VSI down, altimeter up, differential pressure gauge down","VSI up, altimeter down, differential pressure gauge down"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"4940","page":25,"q":"The water separator of an air-conditioning unit is located at the cooling unit:","o":["inlet and uses an evaporation process","inlet and uses a centrifugal process","outlet and uses an evaporation process","outlet and uses a centrifugal process"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"4941","page":25,"q":"The turbine in a cold air unit (air cycle machine):","o":["drives the compressor which provides pressurisation","drives the compressor in the unit, creating a temperature drop in the conditioning air","increases the pressure of the air supply to the cabin","drives the compressor in the unit and causes a pressure increase in the conditioning air"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"4951","page":25,"q":"In a BOOTSTRAP cooling system, the charge air is first compressed in the cold air unit to:","o":["maintain a constant cabin mass air flow","increase the cabin air supply pressure when the charge pressure is too low","ensure an adequate charge air flow across the inter-cooler heat exchanger","ensure an adequate pressure and temperature drop across the cooling turbine"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"4952","page":25,"q":"The term PRESSURE CABIN applies when an aeroplane:","o":["has the ability to maintain a constant cabin altitude at all flight altitudes","has the means to maintain cabin pressure higher than ambient pressure","is only pressurised in the area of the control cabin","has the ability to maintain a constant cabin differential pressure at all flight altitudes"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"4962","page":25,"q":"The pneumatic system accumulator is useful:","o":["to eliminate the fluid flow variations","to eliminate the fluid pressure variations","to offset for the starting of some devices","in emergency cases"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"4995","page":25,"q":"\"Conditioned\" air is air that has:","o":["had any moisture removed from it","been controlled in respect of temperature and pressure","had the oxygen content increased","had the oxygen content reduced"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"5010","page":25,"q":"Under normal flight conditions, cabin pressure is controlled by:","o":["pressurisation duct relief valve(s)","regulating the discharge of air through the outflow valve(s)","engine rpm","inward relief valve(s)"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"5017","page":26,"q":"A cabin pressure controller maintains a pre-set cabin altitude by regulating the:","o":["position of the duct relief valve(s)","mass air flow into the cabin","position of the inward relief valve","position of the outflow valve(s)"],"a":3,"t":"pr","fig":null,"s":"air"},{"id":"5035","page":26,"q":"The pneumatic ice protection system is mainly used for:","o":["pitot tubes","wings","propellers","engine intakes"],"a":1,"t":"ice","fig":null,"s":"air"},{"id":"11970","page":26,"q":"The purpose of the cabin pressure controller, in the automatic mode, is to perform the following functions: 1) control the cabin altitude 2) control the cabin altitude rate-of-change 3) limitation of differential pressure 4) balancing aircraft altitude with cabin altitude 5) cabin ventilation 6) keeping a constant differential pressure throughout all the flight phases. The combination regrouping all the correct statements is:","o":["2, 6, 4","5, 6, 1","4, 5, 3","1, 2, 3"],"a":3,"t":"pr","fig":null,"s":"air"},{"id":"11971","page":26,"q":"The purpose of cabin air flow control valves in a pressurization system is:","o":["regulate cabin pressure at the maximum cabin pressure differential","maintain a constant and sufficient mass air flow to ventilate the cabin and minimise cabin pressure changes","regulate cabin pressure to the selected altitude","discharge cabin air to atmosphere if cabin pressure rises above the selected altitude"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"11972","page":26,"q":"Cabin pressure is controlled by:","o":["the cabin air mass flow control inlet valve(s)","delivering a substantially constant flow of air into the cabin and controlling the outflow","controlling the flow of air into the cabin with constant outflow","the cabin air re-circulation system"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"11973","page":26,"q":"The cabin air for modern airplanes is usually supplied by:","o":["roots type compressors","single radial compressors","main engine compressors","piston compressors"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"11974","page":26,"q":"In an aircraft air conditioning system the air cannot be treated for:","o":["pressure","temperature","humidity","purity"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"12008","page":26,"q":"In a manually operated system, the cabin altitude rate of change is normally controlled by:","o":["the difference between the barometric pressure selected on the cabin pressure controller and ambient barometric pressure","the duct relief valve when operating at the maximum cabin differential pressure","a rate of change selector","the difference between the altitude selected on the cabin pressure controller and the aeroplane altitude"],"a":2,"t":"pr","fig":null,"s":"air"},{"id":"20159","page":26,"q":"In large modern aircraft, in the air conditioning system, reduction of air temperature and pressure is achieved by:","o":["an expansion turbine","a compressor","a condenser","an evaporator"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"20166","page":26,"q":"\"Conditioned\" air is air that has:","o":["oxygen content increased","oxygen content reduced","been controlled in respect of temperature and pressure","oxygen content regulated to a preset value"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"20170","page":26,"q":"During flight, the wing anti-ice system has to protect:","o":["the whole upper wing surface and the flaps","a part of the whole leading edge","slats and the leading edge flaps only","the whole leading edge and the whole upper wing surface"],"a":1,"t":"ice","fig":null,"s":"air"},{"id":"20202","page":27,"q":"(Refer to figure 021-41) Automatic temperature control of the system as shown, would be accomplished by:","o":["the cabin sensors only modulating the mix valve","the temperature selector only modulating the mix valve","automatic control of the ram air","the temperature selector in conjunction with cabin sensors and the temperature regulator, modulating the mix valve"],"a":3,"t":"ac","fig":"021-41","s":"air"},{"id":"20210","page":27,"q":"A freon air conditioning system comprises:","o":["A heat exchanger taking air from the engine to provide air to the cabin over a wide range of temperatures","An electrically driven compressor to supply warm air for heating and a heat exchanger to provide cold air","A compressor and heat exchanger to provide cold air to the cabin with hot air supplied from the engine for heating","An electrically driven compressor and heat exchanger arrangement which uses ambient to supply the cabin with air over a wide range of temperatures"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"20230","page":27,"q":"A turbo compressor air conditioning system (bootstrap system) will:","o":["not affect the charge air pressure","cause a pressure drop as well as an associated temperature drop in the charge air","increase charge air pressure whilst causing the temperature to drop in the heat exchanger","decrease charge air pressure whilst causing the temperature to rise in the heat exchanger"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"20241","page":27,"q":"An aircraft with a pressurized cabin flies at FL 310 and, following a malfunction of the pressure controller, the outflow valve runs to the open position. Given: CAB V/S = Cabin rate of climb indication; CAB ALT = Cabin pressure altitude; DELTA P = Pressure differential","o":["CAB V/S decrease, CAB ALT decrease, DELTA P increase","CAB V/S decrease, CAB ALT increase, DELTA P decrease","CAB V/S increase, CAB ALT increase, DELTA P increase","CAB V/S increase, CAB ALT increase, DELTA P decrease"],"a":3,"t":"pr","fig":null,"s":"air"},{"id":"20255","page":27,"q":"Cabin air for a large aeroplane during flight:","o":["has a constant oxygen ratio regulated to a preset value","is temperature controlled","has an increased oxygen ratio","has a reduced oxygen ratio"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"20256","page":27,"q":"Cabin air for JAR 25 aeroplanes is usually taken from:","o":["the low pressure compressor","the second fan stage","the high pressure compressor","the high pressure compressor and from the low pressure compressor if necessary"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"20310","page":27,"q":"If the automatic control of an air conditioning system fails:","o":["The pilot can revert to manual control and 'beep' the control valve to the required setting","The system must be shut down","Manual control can be selected but this is limited to 'hot air' or 'cold air' only","The red failure light will illuminate"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"20319","page":27,"q":"In a turbo compressor air conditioning system (bootstrap system) the supply of air behind the primary heat exchanger is:","o":["compressed, then passed across an expansion turbine and finally across a heat exchanger","passed across an expansion turbine, compressed and then passed through a heat exchanger","passed across an expansion turbine, then directly to the heat exchanger","compressed, passed through a heat exchanger, and then across an expansion turbine"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"20320","page":27,"q":"In a turbo compressor air conditioning system (bootstrap system), the main water separation unit is:","o":["before the cooling turbine","before the heat exchangers","after the cooling turbine","just after the heat exchangers"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"20321","page":27,"q":"In a turbo compressor air conditioning system (bootstrap system), the purpose of the heat exchangers is to:","o":["cool the bleed air in front and behind the compressor of the air cycle machine","allow a homogeneous temperature by mixing air flows from various air conditioning groups in operation","cool bleed air before entering the complete pneumatic system","allow a steady compressor outlet temperature"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"20322","page":28,"q":"In a typical bootstrap cooling system the supply air is:","o":["compressed, passed through a secondary heat exchanger, and then across an expansion turbine","passed across an expansion turbine, then compressed and passed through a secondary heat exchanger","passed across an expansion turbine, then directly to the heat exchanger","passed across an expansion turbine, then through a secondary heat exchanger and then across a compressor"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"20324","page":28,"q":"In an air cycle machine:","o":["the turbine increases the pressure of the air supply to the cabin","the turbine drives the compressor which provides pressurisation","the turbine drives the compressor of the machine which causes a higher temperature, and so increases the second heat exchanger efficiency","the temperature drop across the turbine is the main contributor to the cooling effect of the air cycle machine"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"20325","page":28,"q":"In flight, the cabin air for large jet transport aeroplanes is usually supplied by:","o":["piston compressors","engine compressors","ram air intakes","single radial compressors"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"20358","page":28,"q":"Regarding a thermal wing anti-icing system, the correct statement is:","o":["Aerodynamic performances of the wings are maintained and there is a reduction of maximum engine thrust","Aerodynamic performances of the wings are not maintained and there is no reduction of maximum engine thrust","Aerodynamic performances of the wings are maintained and there is no reduction of maximum engine thrust","Aerodynamic performances of the wings are not maintained and there is a reduction of maximum engine thrust"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"20373","page":28,"q":"Temperature regulation of an air conditioning system:","o":["Is automatically controlled by sensing the output temperature from the control valve in relation to the temperature set on the pilot's control panel","Cannot be automatically controlled","Is manually controlled by the pilot reading the cabin temperature gauge and increasing or decreasing hot air as required","Is automatically controlled by sensing cabin temperature in relation to engine compressor outlet temperatures"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"20430","page":28,"q":"The purpose of an air conditioning pack inlet flow valve (pack valve) is to:","o":["discharge cabin air to atmosphere if cabin pressure rises above the selected altitude","regulate cabin pressure to the selected altitude","maintain a constant and sufficient air mass flow to ventilate the cabin","regulate cabin pressure at the maximum cabin pressure differential"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"20461","page":28,"q":"The wing ice protection system currently used for most large turboprop transport aeroplanes is a(n):","o":["pneumatic system with inflatable boots","electrical de-icing system","hot air system","liquid de-icing system"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"20490","page":28,"q":"Whilst in level cruising flight, an aeroplane with a pressurised cabin experiences a malfunction of the pressure controller. If the cabin rate of climb indicator reads -200 ft/min:","o":["a descent must be initiated to prevent the oxygen masks dropping when the cabin altitude reaches 14000 ft","the differential pressure will rise to its maximum value, thus causing the safety relief valves to open","the aircraft has to climb to a higher flight level in order to reduce the cabin altitude to its initial value","the crew has to intermittently cut off the incoming air flow in order to maintain a zero cabin altitude"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"21422","page":29,"q":"The air-conditioning pack of a present-day aircraft consists of several components. These include two heat exchangers; the primary exchanger (P) and the secondary exchanger (S). The functions of these heat exchangers are as follows:","o":["P: pre-cools the engine bleed air; S: increases the temperature of the air used for air-conditioning of cargo compartment (animals)","P: precools the engine bleed air; S: reduces the temperature of the air from the primary exchanger or from the pack's compressor","P: warms up engine bleed air; S: recirculates the cabin air, reducing its temperature","P: warms up engine bleed air; S: increases the temperature of air originating from the compressor of the pack"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"21924","page":29,"q":"With regard to the pneumatic mechanical devices which afford protection against the formation of ice, the only correct statement is:","o":["The pneumatic mechanical device can only be used as a de-icing device","The pneumatic mechanical device is used a lot on modern aircraft as it is inexpensive and easy to maintain","The pneumatic mechanical device can only be used as an anti-icing device","The inflatable de-ice boots of the pneumatic mechanical device are arranged perpendicular to the leading edges"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"22003","page":29,"q":"In a bootstrap air conditioning system what is the first thing the air does?","o":["goes through the compressor, secondary heat exchanger, turbine","goes through the compressor, turbine, secondary heat exchanger","goes through the turbine, compressor, secondary heat exchanger","goes through the primary heat exchanger, turbine and compressor"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"22004","page":29,"q":"Where is the water separator?","o":["before the cold air unit","after the cold air unit","between the compressor and turbine","after the humidifier"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"22005","page":29,"q":"If an aircraft maximum operating altitude is limited by the pressure cabin, this limit is controlled by:","o":["the maximum positive pressure differential at maximum operating ceiling","the maximum positive pressure differential at maximum cabin altitude","the maximum number of pressurisation cycles","the maximum zero fuel mass at maximum pressure altitude"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"22006","page":29,"q":"If the pressure controller malfunctions and the outflow valve malfunctions (remains fully open), what happens to: (i) Cabin ROC (ii) Cabin Altitude (iii) Differential pressure","o":["(i) increase, (ii) increase, (iii) decrease","(i) decrease, (ii) increase, (iii) decrease","(i) increase, (ii) decrease, (iii) decrease","(i) increase, (ii) increase, (iii) increase"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"22007","page":29,"q":"What is \"conditioned air\"?","o":["air adjusted for temperature and pressure","air adjusted for temperature","air adjusted for pressure","air adjusted for mass flow"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"22008","page":29,"q":"If the cabin pressure tends to decrease below ambient:","o":["the inward relief valve will close","the inward relief valve will open","the outward relief valve will open","the outward relief valve will close"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"22009","page":29,"q":"What defines \"cabin altitude\"?","o":["the same cabin altitude is maintained as outside","the pressure altitude in the cabin","the difference in pressure between the cabin and outside","the pressure altitude of the aircraft"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"22011","page":29,"q":"In an air cycle air conditioning system what is the function of the ground-cooling fan?","o":["to draw cooling air over the turbine","to draw cooling air over the heat exchangers","to blow air into the compressor","to re-circulate air through the mix manifold"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"22012","page":29,"q":"Maximum differential pressure of a large transport aircraft is:","o":["3 - 5 psi","7 - 9 psi","10 - 14 psi","15 - 19 psi"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"22013","page":29,"q":"The turbine in the air-conditioning machine:","o":["increases the air temperature and drives the compressor","drives compressor and creates a temperature drop in the conditioned air","increases the pressure of air supply to the cabin","is driven by the compressor and reduces the temperature of conditioned air"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"22015","page":30,"q":"The dehumidifier (water separator) is fitted:","o":["After the cooling system & operates on a condensation principle","After the cooling system & operates on an evaporation principle","Before the cooling system & operates on a condensation principle","Before the cooling system & operates on an evaporation principle"],"a":0,"t":"ac","fig":null,"s":"air"},{"id":"22016","page":30,"q":"(Refer to figure 021-42) Determine the maximum operating altitude for an aircraft with a maximum differential pressure of 7 psi and a cabin altitude of 4000 ft.","o":["22,000 ft","24,000 ft","26,000 ft","28,000 ft"],"a":1,"t":"pr","fig":"021-42","s":"air"},{"id":"22127","page":30,"q":"In a bleed air anti icing system the areas that are heated are:","o":["the leading edge slats and flaps","the whole surface of the aircraft","the trailing edge flaps","the leading edges of the wings and empennage"],"a":3,"t":"ice","fig":null,"s":"air"},{"id":"22128","page":30,"q":"On a modern turbo prop aircraft the most commonly used method of anti-icing/de-icing the wings is?","o":["fluid","electrical heater mats","pneumatic boots","hot air bled from the engines"],"a":2,"t":"ice","fig":null,"s":"air"},{"id":"22133","page":30,"q":"Anti-icing in a modern jet airliner is:","o":["Electric","Mechanical","Hot air","Liquid"],"a":2,"t":"ice","fig":null,"s":"air"},{"id":"22134","page":30,"q":"Pneumatic boot de-icing on wing leading edge:","o":["has a cycle that lasts longer than 10 seconds","has 10 cycles a second","prevents ice build up","should be permanently selected on"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"22181","page":30,"q":"The purpose of a ditching control valve is?","o":["close the outflow valves","open outflow valves","to allow rapid depressurisation","to dump the toilet water after landing"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"22182","page":30,"q":"In a bleed air anti icing system the areas that are heated are:","o":["the whole of the wing","wing leading edge slats and flaps","wing leading edges and slats","trailing edge flaps"],"a":2,"t":"ice","fig":null,"s":"air"},{"id":"22184","page":30,"q":"If during pressurised flight the outflow valve closes fully due to a fault in the pressure controller the:","o":["Skin will be overstressed and could rupture","Safety valve opens when the differential pressure reaches structural max diff","The inward relief valve will open to prevent excessive negative differential","ECS packs are automatically closed down"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"22201","page":30,"q":"Why, in the bootstrap system, is the air compressed before it enters the heat exchanger?","o":["To provide a constant mass flow to the cabin","To ensure maximum pressure and temperature drop across the turbine","To ensure most rapid cooling through the heat exchanger","To provide a constant temperature air flow to the cabin"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"22209","page":30,"q":"The type of refrigerant used in a vapour cycle cooling system is:","o":["Argon","Freon","Helium","BCF"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"22217","page":30,"q":"If cabin pressure is decreasing, the cabin VSI will indicate:","o":["zero","climb","descent","reducing pressure"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"22231","page":30,"q":"What is the 'Bootstrap' System in Cabin Pressurisation?","o":["The Secondary heat exchanger","The Primary heat exchanger","The Compressor","The Low-pressure bleed-air Cold Air Unit"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"22232","page":30,"q":"How is Cabin Temperature controlled in pressurised systems?","o":["By passengers individually","Automatically or by the Pilot","Automatically","By adding water to the processed air"],"a":1,"t":"ac","fig":null,"s":"air"},{"id":"22239","page":31,"q":"An aircraft is in straight and level flight at a constant Cabin Altitude when the crew notice the Cabin rate of climb indicator reads -200 ft/min. What will be the sequence of events?","o":["Crew should begin a climb to regain Cabin Altitude","Cabin Altitude will increase to outside atmospheric pressure","Cabin Altitude will descend to, and continue beyond normal max-diff, at which point the safety-valves will open","Cabin Altitude will increase to, and continue beyond normal max-diff, at which point the safety-valves will open"],"a":2,"t":"pr","fig":null,"s":"air"},{"id":"22241","page":31,"q":"The principle upon which the Vibrating probe (Rosemount) ice-detector is based is?","o":["Inferential","Accretion","Ice removal","Evaporation"],"a":1,"t":"ice","fig":null,"s":"air"},{"id":"22252","page":31,"q":"The advantages of Thermal Anti-Icing are?","o":["There is less disruption to the L/E airflow","The engine performance is reduced","Boots operate more effectively","Generators can be paralleled"],"a":0,"t":"ice","fig":null,"s":"air"},{"id":"22256","page":31,"q":"In a modern jet aircraft from where is the air supply obtained?","o":["From ram supply","From the Nozzle guide vanes","From the LP and HP compressors as required","From a stored gaseous source"],"a":2,"t":"ac","fig":null,"s":"air"},{"id":"22257","page":31,"q":"If the Cabin Altitude climbs, what is happening to the differential pressure?","o":["Reduces","Increases","Remains constant","Fluctuates"],"a":0,"t":"pr","fig":null,"s":"air"},{"id":"22265","page":31,"q":"The normal air-conditioning Cabin pressure altitude is:","o":["Sea Level","10,000 ft","25,000 ft","8,000 ft"],"a":3,"t":"pr","fig":null,"s":"air"},{"id":"22266","page":31,"q":"What is the purpose of the Cabin Conditioning out-flow valves?","o":["To minimise the cabin pressure differential up to cruising altitude","To maximise the cabin pressure differential up to cruising altitude","To prevent exceeding the maximum positive pressure differential","To prevent exceeding the maximum negative pressure differential"],"a":1,"t":"pr","fig":null,"s":"air"},{"id":"22273","page":31,"q":"What is the function of the heat exchanger in a bootstrap air conditioning system?","o":["cool the bleed air","cool the compressor outlet air","cool the turbine outlet air","cool the bleed air then cool the compressor outlet air"],"a":3,"t":"ac","fig":null,"s":"air"},{"id":"16","page":32,"q":"On a jet aircraft fuel heaters are:","o":["installed only in the center tank","installed in each tank","located on the engines","not necessary at all"],"a":2,"t":"pumps","fig":null,"s":"fuel"},{"id":"29","page":32,"q":"Fuel tank booster pumps are:","o":["centrifugal, low pressure","centrifugal, high pressure","gear type, low pressure","gear type, high pressure"],"a":0,"t":"pumps","fig":null,"s":"fuel"},{"id":"44","page":33,"q":"The capacitance type fuel gauging system indicates the fuel quantity by measuring the:","o":["resistivity variation of the fuel","density variation of the fuel","dielectric change between fuel and air","electrical resistance change"],"a":2,"t":"gauge","fig":null,"s":"fuel"},{"id":"2735","page":33,"q":"Fire precautions to be observed before refuelling are:","o":["All bonding and earthing connections between ground equipment and the aircraft should be made before filler caps are removed","Ground Power Units (GPU) are not to be operated","Passengers may be boarded (traversing the refuelling zone) providing suitable fire extinguishers are readily available","Aircraft must be more than 10 metres from radar or HF radio equipment under test"],"a":0,"t":"refuel","fig":null,"s":"fuel"},{"id":"4425","page":33,"q":"On a transport type aircraft the fuel tank system is vented through:","o":["Ram air scoops on the underside of the wing","A pressure regulator in the wing tip","Bleed air from the engines","The return lines of the fuel pumps"],"a":0,"t":"tanks","fig":null,"s":"fuel"},{"id":"4433","page":33,"q":"During fueling the automatic fueling shut off valves will switch off the fuel supply system when:","o":["there is fire","fuelling system has reached a certain pressure","the surge vent tank is filled","the fuel has reached a predetermined volume or mass"],"a":3,"t":"refuel","fig":null,"s":"fuel"},{"id":"4447","page":33,"q":"The automatic fuelling shut off valve:","o":["stops fuelling as soon as a certain fuel level is reached inside the tank","cuts off the fuel in case of engine fire","stops fuelling as soon as the fuel spills into the vent-line","stops fuelling as soon as a certain pressure is reached"],"a":0,"t":"refuel","fig":null,"s":"fuel"},{"id":"4462","page":33,"q":"Fuel dump systems are required:","o":["on all transport category aircraft where the Maximum Take-Off Weight (MTOW) is significantly higher than the Maximum Landing Weight (MLW)","on all transport category aircraft","on all transport category aircraft with more than 150 seats","on aircraft with a Maximum Take-Off Weight (MTOW) higher than 5.7 tons"],"a":0,"t":"refuel","fig":null,"s":"fuel"},{"id":"4505","page":33,"q":"Fuel is pressurized to:","o":["prevent cavitation","prevent vapour lock","keep constant fuel flow in negative G","prevent fuel icing"],"a":1,"t":"pumps","fig":null,"s":"fuel"},{"id":"4521","page":33,"q":"On most transport aircraft, the low pressure pumps of the fuel system are:","o":["piston pumps","gear type pumps","centrifugal pumps","diaphragm pumps"],"a":2,"t":"pumps","fig":null,"s":"fuel"},{"id":"4571","page":33,"q":"The fuel system boost pumps are used to:","o":["feed the fuel control units, which inject the pressurized fuel into the engine","avoid the bubbles accumulation","feed the lines with fuel for directing it to the engine at a positive pressure","avoid the bubbles accumulation and feed the lines with fuel for directing it to the engine at a positive pressure"],"a":3,"t":"pumps","fig":null,"s":"fuel"},{"id":"4609","page":33,"q":"The purpose of the baffles in an aircraft's integral fuel tank is to:","o":["Prevent overpressure in the tank","Prevent the fuel from flowing to the wing tips during abnormal manoeuvre (side slipping...)","Prevent the fuel from flowing in the vent lines","Prevent mixture of the fuel and hydraulic fluid"],"a":1,"t":"tanks","fig":null,"s":"fuel"},{"id":"4644","page":33,"q":"The Maximum Zero Fuel Weight: 1) Is a limitation set by regulation 2) Is designed for a maximum load factor 3) Is due to the maximum bending moment at wing root 4) Requires to empty external tanks first 5) Requires to empty internal tanks first. The correct combination of true statements is:","o":["2, 5","1, 2, 3","2, 4","1, 3, 5"],"a":1,"t":"quality","fig":null,"s":"fuel"},{"id":"4645","page":33,"q":"The vapor lock is:","o":["The exhaust gases obstructions caused by an engine overheating","A stoppage in a fuel feeding line caused by a fuel vapor bubble","The effect of the water vapor bubbles in the induction manifold caused by the condensation","The abnormal mixture enrichment caused by a greater gasoline vaporisation in the carburettor"],"a":1,"t":"pumps","fig":null,"s":"fuel"},{"id":"4650","page":34,"q":"The fuel supply system on a jet engine includes a fuel heating device, upstream of the main fuel filter so as to:","o":["ease low pressure pumps work by increasing fuel fluidity","maintain and improve fuel heating power","prevent, at low fuel temperature, the risk of ice formation from water contained in the fuel","prevent fuel from freezing in fuel pipes due to low temperatures at high altitude"],"a":2,"t":"pumps","fig":null,"s":"fuel"},{"id":"4702","page":34,"q":"The maximum quantity of fuel that can be dumped with the jettisoning system is:","o":["All fuel until the maximum landing weight is reached","15 tons","All fuel","All up to a defined reserve quantity"],"a":3,"t":"refuel","fig":null,"s":"fuel"},{"id":"4786","page":34,"q":"The function of a feed box in the fuel tank is to:","o":["distribute the fuel to the various tanks during refuelling","trap fuel sediments or sludge in the lower part of the tank","increase the fuel level at the boost pump location","ventilate the tank during refuelling under high pressure"],"a":2,"t":"tanks","fig":null,"s":"fuel"},{"id":"4809","page":34,"q":"The types of fuel tanks used on most modern transport aircraft are:","o":["Cell tanks","Integral tanks","Combined fuel tanks","Fixed built-in tanks"],"a":1,"t":"tanks","fig":null,"s":"fuel"},{"id":"4816","page":34,"q":"In a compensated capacitance type quantity indicating system, the contents gauge of a half-full fuel tank indicates a fuel mass of 8000 kg. If a temperature rise increased the volume of fuel by 5 %, the indicated fuel weight would:","o":["decrease by 5 %","increase by 5 %","remain the same","increase by 10 %"],"a":2,"t":"gauge","fig":null,"s":"fuel"},{"id":"4830","page":34,"q":"The pressurization of tanks is maintained by the fuel:","o":["vent system","tank drains","top off unit","dump system"],"a":0,"t":"tanks","fig":null,"s":"fuel"},{"id":"4888","page":34,"q":"On most transport jet aircraft, the low pressure pumps of the fuel system are supplied with electric power of the following type:","o":["115 V DC","115 V AC","28 V DC","28 V AC"],"a":1,"t":"pumps","fig":null,"s":"fuel"},{"id":"4909","page":34,"q":"Fuel pumps submerged in the fuel tanks of a multi-engine aircraft are:","o":["centrifugal high pressure type pumps","centrifugal low pressure type pumps","high pressure variable swash plate pumps","low pressure variable swash plate pumps"],"a":1,"t":"pumps","fig":null,"s":"fuel"},{"id":"4917","page":34,"q":"The purpose of baffle check valves fitted in aircraft fuel tanks is to:","o":["prevent fuel movement to the wing tip","damp out movement of the fuel in the tank","prevent positive pressure build up inside the tank","close the vent lines in case of turbulence"],"a":0,"t":"tanks","fig":null,"s":"fuel"},{"id":"4918","page":34,"q":"How much fuel can be jettisoned?","o":["A specific amount","The captain decides","All","A specified amount must remain"],"a":3,"t":"refuel","fig":null,"s":"fuel"},{"id":"4978","page":34,"q":"The fuel crossfeed system:","o":["allows feeding of any engine from any fuel tank","is only used to feed an engine from the tank of the opposite wing","is only used on the ground for fuel transfer from one tank to another","is only used in flight for fuel transfer from one tank to another"],"a":0,"t":"pumps","fig":null,"s":"fuel"},{"id":"5028","page":34,"q":"The refueling in a transport jet aircraft is made...","o":["By means of the aircraft suction pumps","Through the refueling cap of every tank","Through a unique point (an underwing refueling center)","By means of the aircraft suction pumps through a unique point (an underwing refueling center)"],"a":2,"t":"refuel","fig":null,"s":"fuel"},{"id":"5047","page":34,"q":"In a compensated capacitance fuel contents system what happens to a fuel weight of 8000lbs if its volume increases by 5%?","o":["Decreases by 5%","Increases by 5%","Remains the same","Increases by 5% for every degree rise in temperature"],"a":2,"t":"gauge","fig":null,"s":"fuel"},{"id":"7194","page":35,"q":"Fuel stored in aircraft tanks will accumulate moisture. The most practical way to minimize this when a plane is used every day or so is to:","o":["keep tanks topped off when plane is not in use","drain tanks at end of each day's flight","use only high octane gasoline","keep tank vents plugged and filler cap tight"],"a":0,"t":"quality","fig":null,"s":"fuel"},{"id":"11976","page":35,"q":"The pressure usually produced by the Boost Pumps (BP) of the fuel supply system is within the following range:","o":["5 to 10 psi","3000 to 5000 psi","300 to 500 psi","20 to 50 psi"],"a":3,"t":"pumps","fig":null,"s":"fuel"},{"id":"11977","page":35,"q":"(Refer to figure 021-39) The diagram shown in annex represents a jet fuel system. The fuel-flow measurement is carried out:","o":["after high pressure pump first stage (item 2)","after low pressure valve (item 1)","after high pressure valve (item 4)","in the fuel control unit (item 3)"],"a":2,"t":"gauge","fig":"021-39","s":"fuel"},{"id":"11978","page":35,"q":"The purpose of the barometric correction in a fuel controller is to:","o":["maintain the correct weight fuel to air ratio when the altitude increases","reduce the fuel-to-air ratio when altitude increases","increase the fuel-to-air ratio when altitude increases","maintain a constant fuel metering whatever the altitude"],"a":0,"t":"pumps","fig":null,"s":"fuel"},{"id":"11992","page":35,"q":"(Refer to figure 021-09) In flight, with center tank empty and APU operating, a fuel unbalance is detected (quantity in tank 1 < quantity in tank 2). Rebalancing of the two tanks is:","o":["impossible without causing the APU stop","possible with \"CROSSFEED\" open and tank 2 pumps \"OFF\"","impossible because there is no fuel in center tank","possible with \"CROSSFEED\" open and tank 1 pumps \"OFF\" and tank 2 pumps \"ON\""],"a":3,"t":"pumps","fig":"021-09","s":"fuel"},{"id":"11998","page":35,"q":"The fuel system boost pumps are submerged in the fuel:","o":["to cool the pumps","to prime the pumps","because their efficiency is greater","to shorten the fuel lines, so minimising the pressure losses"],"a":1,"t":"pumps","fig":null,"s":"fuel"},{"id":"12020","page":35,"q":"VAPOR LOCK is the phenomenon by which:","o":["abrupt and abnormal enrichment of the fuel/air mixture following an inappropriate use of carburettor heat","burnt gas plugs forming and remaining in the exhaust manifold following an overheat and thereby disturbing the exhaust","heat produces vapour bubbles in the fuel line","water vapour plugs are formed in the intake fuel line following the condensation of water in fuel tanks which have not been drained properly"],"a":2,"t":"pumps","fig":null,"s":"fuel"},{"id":"12386","page":35,"q":"The primary LP fuel pump is driven by:","o":["Hydraulic pressure","Air pressure","The engine","The electrical system"],"a":2,"t":"pumps","fig":null,"s":"fuel"},{"id":"12399","page":35,"q":"During refueling operations:","o":["The aircraft should be bonded to the refueller before refueling pipes are coupled","A refueling zone is to be established to at least 100 m","Passengers are forbidden to remain on the aircraft regardless of the type of fuel being replenished","Radio transmissions are not forbidden"],"a":0,"t":"refuel","fig":null,"s":"fuel"},{"id":"20157","page":35,"q":"On most transport aircraft, the low pressure pumps of the fuel system are:","o":["electro-mechanical wobble pumps, with self-regulated pressure","mechanically driven by the engine's accessory gearbox","removable only after the associated tank has been emptied","centrifugal pumps, driven by an electric motor"],"a":3,"t":"pumps","fig":null,"s":"fuel"},{"id":"20161","page":35,"q":"The cross-feed fuel system is used to:","o":["automatically fill every tank up to the desired level","feed every engine from any fuel tank","allow the fuel to be quickly thrown away in case of emergency","allow the unusable fuel elimination"],"a":1,"t":"pumps","fig":null,"s":"fuel"},{"id":"20237","page":36,"q":"Aircraft fuel tanks should be checked for water:","o":["immediately after every refuelling","before the first flight of the day","during refuelling","always before each flight"],"a":1,"t":"quality","fig":null,"s":"fuel"},{"id":"20265","page":36,"q":"During re-fuelling the automatic shut-off valves will switch off the fuel supply system when:","o":["the fuel has reached a predetermined volume or mass","fuelling system has reached a certain pressure","the surge vent tank is filled","there is fire"],"a":0,"t":"refuel","fig":null,"s":"fuel"},{"id":"20293","page":36,"q":"Fuel pressure is measured:","o":["At the outlet from the fuel control unit","Always at the outlet of the high pressure pump only","In the line between the booster pump and the engine or at the outlet of the high pressure filter","In the line between the high pressure filter and the high pressure pump"],"a":2,"t":"pumps","fig":null,"s":"fuel"},{"id":"20297","page":37,"q":"Fuel tank vents are:","o":["Routed so that all tanks are interconnected to maintain an equal pressure throughout the system","Fitted to duct fuel vapour from the tank to the engine exhaust","Fitted to the lower part of the tank and routed direct to atmosphere","Fitted to the top of the tank to prevent tank collapse and are routed to the opposite upper part of the fuselage"],"a":3,"t":"tanks","fig":null,"s":"fuel"},{"id":"20331","page":37,"q":"In the event of an engine fire:","o":["An automatic shut off valve is moved to the closed position controlled by the fire sensing system","The fuel supply is disconnected by a quick release coupling","The fuel supply is isolated from the engine by a pilot controlled fuel shut off valve","The fuel installation is protected by an automatic fire extinguishing system"],"a":2,"t":"pumps","fig":null,"s":"fuel"},{"id":"20352","page":38,"q":"One of the purposes of the fuel system booster pumps to be submerged in the fuel is:","o":["To cool the pumps","To improve their efficiency","To shorten the fuel lines, so minimising the pressure losses","To facilitate the priming of the pumps"],"a":3,"t":"pumps","fig":null,"s":"fuel"},{"id":"20387","page":38,"q":"The fuel cross-feed system:","o":["allows feeding of any engine from any fuel tank","is only used to feed an engine from the tank of the opposite wing","is only used on the ground for fuel transfer from one tank to another","is only used in flight for fuel transfer from one tank to another"],"a":0,"t":"pumps","fig":null,"s":"fuel"},{"id":"20392","page":38,"q":"The engine fuel control unit (FCU) is protected from damage by debris by:","o":["The fine filter located between the high pressure fuel pump and the governor unit","A fine filter located prior to the high pressure fuel pump at the inlet to the fuel control unit","Strainers at the inlet to the low pressure fuel pumps","Magnetic plugs located at various positions throughout the fuel supply usually at the outlet of fuel pumps and valves"],"a":0,"t":"pumps","fig":null,"s":"fuel"},{"id":"20396","page":38,"q":"The fuel cross-feed system enables:","o":["the supply of the engines mounted on a wing from any fuel tank within that wing","the supply of any engine from any fuel tank","the supply of the outboard engines from any outboard fuel tank","the transfer of fuel only from the centre tank to oduces per unit volume","the specific gravity of the fuel"],"a":0,"t":"quality","fig":null,"s":"fuel"},{"id":"22055","page":38,"q":"How are modern passenger aircraft fuel tanks pressurised?","o":["by bleed air from the pneumatic system","by separate reservoirs of inert gas","by ram air through the vent system","by a volumetric top off unit"],"a":2,"t":"tanks","fig":null,"s":"fuel"},{"id":"22056","page":39,"q":"When does the Low Pressure fuel shut off valve close?","o":["when the engine fuel switch is selected 'on' during engine start","when flight idle is selected","after a booster pump failure","when the fire handle is pulled"],"a":3,"t":"pumps","fig":null,"s":"fuel"},{"id":"22057","page":39,"q":"A volumetric top off valve works with:","o":["pressure sensors","flow rate sensors","float switches","capacitive sensing systems"],"a":2,"t":"refuel","fig":null,"s":"fuel"},{"id":"22058","page":39,"q":"(Refer to figure 021-09) If the centre tank is empty and there is more fuel in the left hand tank than the right is it possible to balance the fuel in the wing tanks in flight?","o":["yes, if the crossfeed cock is open","yes, if the manual defuelling valve is opened","yes, if the crossfeed cock is left open and the LP pumps are turned off in the right hand tank","no"],"a":2,"t":"pumps","fig":"021-09","s":"fuel"},{"id":"22059","page":39,"q":"What pressure would you find at the booster pump under normal conditions?","o":["5-10 psi","20-50 psi","100-200 psi","3000-4000 psi"],"a":1,"t":"pumps","fig":null,"s":"fuel"},{"id":"22061","page":39,"q":"If a fuel tank having a capacitive contents gauging system is empty of fuel but has a quantity of water in it:","o":["The gauge will show the mass of fuel equal to the same volume as the water","The gauge will show the volume of the water","The gauge will show the mass of the water","The gauge will show full"],"a":2,"t":"gauge","fig":null,"s":"fuel"},{"id":"22062","page":39,"q":"Which fuel tanks are heated?","o":["wing tanks","fuselage tanks","all tanks","none"],"a":3,"t":"pumps","fig":null,"s":"fuel"},{"id":"22063","page":39,"q":"Fuel tanks accumulate moisture, the most practical way to limit this in an aircraft flown daily is:","o":["to secure the drain plugs and filler caps","drain the tank at the end of each day","fill the tank at the end of each flight","drain the water prior to each flight"],"a":2,"t":"quality","fig":null,"s":"fuel"},{"id":"22064","page":39,"q":"Low pressure fuel pumps are:","o":["engine driven","electrically driven centrifugal pumps","driven by the accessory gearbox","swash plate pumps with self governors"],"a":1,"t":"pumps","fig":null,"s":"fuel"},{"id":"22065","page":39,"q":"If a fuel sample is cloudy and clears slowly from the top it is an indication of:","o":["cold soaked fuel","air in the fuel","wax in the fuel","water in the fuel"],"a":3,"t":"quality","fig":null,"s":"fuel"},{"id":"22066","page":39,"q":"Which statement is true concerning the structure and possible advantage of an integral fuel tank?","o":["it is a separate metal container that is relatively light weight","it is built internally using the aircraft structure, this saves weight and space","it is constructed of rubber so it can be fitted into any free space within the aircraft","it is a separate metal container that is relatively cheap to manufacture"],"a":1,"t":"tanks","fig":null,"s":"fuel"},{"id":"22067","page":39,"q":"Fuel tanks on large aircraft are located:","o":["only in the wings","in the wings and in the centre section","in the wings, the centre section and sometimes the fin","in the wings, the centre section and sometimes the fin or part of the hold"],"a":3,"t":"tanks","fig":null,"s":"fuel"},{"id":"22068","page":39,"q":"What purpose do baffles serve?","o":["they reduce unwanted lateral movement of the fuel within the tank","they guide the fuel towards the booster pumps","they give vertical strength to the fuel tank","they strengthen the tank laterally during refuelling"],"a":0,"t":"tanks","fig":null, isk 5) Circuits are not single-wired lines. The combination regrouping all the correct statements is:","o":["1, 2, 3","2, 3, 5","1, 3, 5","1, 2, 4"],"a":3,"t":"bus","fig":null,"s":"dc"},{"id":"11987","page":45,"q":"On board present aircraft, the batteries used are mainly Cadmium-Nickel. Their advantages are: 1) low risk of thermal runaway 2) high internal resistance, hence higher power 3) good charging and discharging capability at high rating 4) wider permissible temperature range 5) good storage capability 6) sturdiness owing to its metal casing 7) the electrolyte density remains unchanged during charging. The combination of correct statements is:","o":["2, 3, 4, 5, 6","3, 4, 6, 7","3, 4, 5, 6","1, 2, 5, 6, 7"],"a":2,"t":"bat","fig":null,"s":"dc"},{"id":"11994","page":45,"q":"The voltage of a fully charged lead-acid battery cell is:","o":["1.8 V","1.2 V","2.2 V","1.4 V"],"a":2,"t":"bat","fig":null,"s":"dc"},{"id":"11995","page":45,"q":"The so called HOT BUSSES or DIRECT BUSSES are:","o":["directly connected to the battery","kept in operating conditions by an electrical resistance in the case of energy failure","automatically connected to the battery if generators have failed","providing an alternative current"],"a":0,"t":"bus","fig":null,"s":"dc"},{"id":"12006","page":45,"q":"A current limiter fuse in a DC generation system is used to:","o":["allow a short term overload before rupturing","limit the current in the field circuit","instantaneously rupture to limit the current in the load","limit the current in the armature"],"a":0,"t":"prot","fig":null,"s":"dc"},{"id":"12018","page":45,"q":"The purpose of a battery protection unit is generally to isolate the battery: 1) from the bus when the battery charge is deemed satisfactory 2) when there is a battery overheat condition 3) in case of an internal short circuit 4) in case of a fault on the ground power unit. The combination regrouping all the correct statements is:","o":["1, 2, 3","1, 2","1, 2, 3, 4","1"],"a":0,"t":"bat","fig":null,"s":"dc"},{"id":"20158","page":45,"q":"A magnetic circuit breaker:","o":["is a protection system that has a quick tripping response","permits an overcurrent limited in time","can be reset without any danger even when fault remains","is a system with a slow response time"],"a":0,"t":"prot","fig":null,"s":"dc"},{"id":"20167","page":45,"q":"A thermal circuit breaker:","o":["protects the system in the event of overload/overheating","uses electromagnetic trip system to prevent over heating","limits any overcurrent","can be re-engaged without any danger even if the fault remains"],"a":0,"t":"prot","fig":null,"s":"dc"},{"id":"20207","page":45,"q":"A current limiter fuse (thermal) in a DC system is used to:","o":["allow a short term overload before rupturing","limit the current in the field circuit","allow no overload before rupturing","limit the current in the armature"],"a":0,"t":"prot","fig":null,"s":"dc"},{"id":"20228","page":45,"q":"A static inverter is powered by:","o":["alternating current and produces an alternating current on output","direct current and produces an alternating current output","direct current and produces a direct current on output","alternating current and produces a direct current on output"],"a":1,"t":"gen","fig":null,"s":"dc"},{"id":"20238","page":46,"q":"Alternating current can be derived from direct current by:","o":["the use of relays","a series wound motor","an alternating current motor","an inverter"],"a":3,"t":"gen","fig":null,"s":"dc"},{"id":"20259","page":46,"q":"Connecting two 12 volt 40 ampere-hour capacity batteries in series will result in a total voltage and capacity respectively of:","o":["24 volts, 80 ampere-hours","12 volts, 40 ampere-hours","24 volts, 40 ampere-hours","12 volts, 80 ampere-hours"],"a":2,"t":"bat","fig":null,"s":"dc"},{"id":"20262","page":46,"q":"Direct current generators are connected:","o":["in parallel to provide maximum voltage","in series to provide maximum power","in series to provide maximum voltage","in parallel to provide maximum power"],"a":3,"t":"gen","fig":null,"s":"dc"},{"id":"20360","page":46,"q":"Regarding Ohm's law:","o":["The power in the circuit is inversely proportional to the square of the current","The current in a circuit is directly proportional to the resistance of the circuit","The current in a circuit is directly proportional to voltage","The current in a circuit is inversely proportional to voltage"],"a":2,"t":"th","fig":null,"s":"dc"},{"id":"20375","page":46,"q":"The advantages of Nickel-Cadmium compared with Lead-Acid batteries are: 1) lower risk of thermal runaway 2) higher internal resistance, hence higher power 3) reduced charging time 4) constant output voltage. The combination regrouping all the correct statements is:","o":["1, 3","1, 2","2, 4","3, 4"],"a":3,"t":"bat","fig":null,"s":"dc"},{"id":"20380","page":46,"q":"The capacity of a battery is given in:","o":["Ampere hours","Amperes/volts","Watts","Ohms"],"a":0,"t":"bat","fig":null,"s":"dc"},{"id":"20381","page":46,"q":"The capacity of a battery is the:","o":["intensity withstood by the battery during charging","number of cycles (charging and discharging) that a battery can withstand without deterioration of its cells","no-load voltage of the battery multiplied by its rated output current","amount of Ampere hours that a fully charged battery can supply"],"a":3,"t":"bat","fig":null,"s":"dc"},{"id":"20440","page":46,"q":"The rating of electrical fuses is expressed in:","o":["ohms","volts","watts","amperes"],"a":3,"t":"prot","fig":null,"s":"dc"},{"id":"20468","page":46,"q":"To reverse the direction of rotation of a shunt-type (parallel field) DC electric motor, it is necessary to:","o":["change the connections from shunt to series","reverse the polarity of the motor connections","reverse the polarity of either the stator or the rotor","connect a phase-shift capacitor to the field circuit"],"a":2,"t":"gen","fig":null,"s":"dc"},{"id":"21424","page":46,"q":"What are the advanta  voltage with increasing load"],"a":0,"t":"bat","fig":null,"s":"dc"},{"id":"21948","page":47,"q":"Electrical potential is measured in:","o":["Watts","Amperes","Ohms","Volts"],"a":3,"t":"th","fig":null,"s":"dc"},{"id":"21949","page":47,"q":"Electromotive force is measured in:","o":["Watts","Ohms","Volts","Amperes"],"a":2,"t":"th","fig":null,"s":"dc"},{"id":"21950","page":47,"q":"Two 12 V / 40 Ah batteries connected in parallel will produce:","o":["12 V 80 Ah","24 V 80 Ah","24 V 40 Ah","12 V 160 Ah"],"a":0,"t":"bat","fig":null,"s":"dc"},{"id":"21951","page":47,"q":"An aircraft has two accumulators, each of 12 V with 40 Ah capacity, connected in series. The resultant unit has:","o":["A voltage of 12 V and a capacity of 80 Ah","A capacity of 120 Ah and a voltage of 12 V","A voltage of 24 V and a capacity of 40 Ah","A capacity of 160 Ah and a voltage of 24 V"],"a":2,"t":"bat","fig":null,"s":"dc"},{"id":"21952","page":47,"q":"Battery voltage is tested with:","o":["A megometer","A voltmeter on rated load","An ammeter on rated load","A dummy load"],"a":1,"t":"bat","fig":null,"s":"dc"},{"id":"21953","page":47,"q":"An aircraft has an accumulator with a capacity of 40 Ah. Assuming that it will provide its nominal capacity and is discharged at the 10 hour rate:","o":["It will pass 40 A for 10 hours","It will pass 4 A for 1 hour","It will pass 40 A 1 hour","It will pass 4 A for 10 hours"],"a":3,"t":"bat","fig":null,"s":"dc"},{"id":"21955","page":47,"q":"A significant increase in battery temperature is an indication of:","o":["Thermal runaway","Excess load on the battery","Alternator failure","Voltage regulator failure"],"a":0,"t":"bat","fig":null,"s":"dc"},{"id":"21957","page":47,"q":"A lead-acid battery is checked for serviceability by:","o":["Using an ammeter","Measuring the specific gravity of the electrolyte","Using an ohmmeter","Measuring the level of the electrolyte"],"a":1,"t":"bat","fig":null,"s":"dc"},{"id":"21958","page":47,"q":"The electrolyte in a nickel cadmium battery is:","o":["Hydrogen peroxide","Nickel dioxide","Potassium hydroxide","Potassium chloride"],"a":2,"t":"bat","fig":null,"s":"dc"},{"id":"21965","page":47,"q":"When a battery is nearly discharged the:","o":["Voltage and current decrease","Voltage decrease only","Current increases because voltage has dropped","Electrolyte will boil"],"a":0,"t":"bat","fig":null,"s":"dc"},{"id":"21966","page":48,"q":"How do you test a battery on an aircraft with a voltmeter?","o":["Off load","On load","There is no specific procedure","It does not matter whether the batteries on load or off load"],"a":1,"t":"bat","fig":null,"s":"dc"},{"id":"21968","page":48,"q":"What is a transistorized static inverter in a DC circuit used for?","o":["Provides main power in place of generators","Provides DC for instruments","Provides AC for instruments","Provides frequency wild AC for instruments"],"a":2,"t":"gen","fig":null,"s":"dc"},{"id":"21989","page":48,"q":"A current limiter fuse:","o":["Ruptures below fault conditions","Has a high melting point so carries considerable current overload before rupturing","Is not used in TRU protection","Has a low melting point so ruptures quickly if a current overload occurs"],"a":1,"t":"prot","fig":null,"s":"dc"},{"id":"21991","page":48,"q":"The so-called hot buses or direct buses are:","o":["directly connected to the battery","kept in operating conditions by an electrical resistance in the case of energy failure","automatically connected to the battery if generators have failed","providing an alternative current"],"a":0,"t":"bus","fig":null,"s":"dc"},{"id":"22099","page":48,"q":"What are the advantages of NICAD batteries?","o":["more compact","longer life","even voltage before rapid discharge","higher voltage than lead acid type"],"a":2,"t":"bat","fig":null,"s":"dc"},{"id":"22101","page":48,"q":"A fuse is rated by:","o":["its resistance in ohms","the current amperage it will carry","the voltage it will carry","the wattage it will pass"],"a":1,"t":"prot","fig":nu
