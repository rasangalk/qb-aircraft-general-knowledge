  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  store.lastSaved = Date.now(); store.dirty = false; persist();
  S.msg = { text: `Saved ${name} to your downloads folder.` }; renderAll();
}
function validSession(s) {
  return s && typeof s.uid === "string" && Array.isArray(s.qids) && typeof s.start === "number"
    && (s.mode === "practice" || s.mode === "exam") && s.answers && typeof s.answers === "object" && s.flags && typeof s.flags === "object";
}
function loadFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch (e) { data = null; }
    if (!data || data.app !== APP || !Array.isArray(data.sessions)) {
      S.msg = { err: true, text: `${file.name} isn't a progress file from this question bank. Choose a file made with Save progress file.` };
      renderAll(); return;
    }
    let added = 0, updated = 0, same = 0;
    data.sessions.filter(validSession).forEach(inc => {
      if (!SUBJ[inc.subject]) inc.subject = "air";
      if (!Array.isArray(inc.topics)) inc.topics = tKeys(inc.subject);
      const cur = sess(inc.uid);
      if (!cur) { store.sessions.push(inc); added++; }
      else if ((inc.updated || 0) > (cur.updated || 0)) { Object.assign(cur, inc); updated++; }
      else same++;
    });
    let notesIn = 0;
    if (data.notes && typeof data.notes === "object") Object.entries(data.notes).forEach(([id, n]) => {
      if (!n || typeof n.text !== "string" || typeof n.updated !== "number") return;
      const cur = store.notes[id];
      if (!cur || n.updated > cur.updated) { store.notes[id] = { text: n.text, updated: n.updated }; notesIn++; }
    });
    persist();
    S.msg = { text: `Loaded ${file.name}: ${added} new session${added === 1 ? "" : "s"}, ${updated} updated, ${same} already here${notesIn ? `, ${notesIn} note${notesIn === 1 ? "" : "s"} added or updated` : ""}.` };
    renderAll();
  };
  r.readAsText(file);
}

function history(exclude) {
  const h = {};
  store.sessions.forEach(s => {
    if (s.uid === exclude) return;
    wrongOf(s).forEach(q => (h[q] = h[q] || { w: 0, f: 0 }).w++);
    flagsOf(s).forEach(q => (h[q] = h[q] || { w: 0, f: 0 }).f++);
  });
  return h;
}

function cardHTML(s, id, n, hist) {

  }).join("");

}

function visible(s) {
  const term = S.search.trim().toLowerCase();
  return qidsOf(s).map((id, i) => [id, i + 1]).filter(([id]) => {
    const q = byId[id], a = s.answers[id], rv = revealed(s);
    if (S.status === "unanswered" && a != null) return false;
    if (S.status === "wrong" && !(rv && a != null && a !== q.a)) return false;
    if (S.status === "right" && !(rv && a === q.a)) return false;
    if (S.status === "flagged" && !s.flags[id]) return false;
    if (S.status === "noted" && !hasNote(id)) return false;
    if (term && !(id === term || (q.q + " " + q.o.join(" ")).toLowerCase().includes(term))) return false;
    return true;
  });
}

function listHTML(s) {

// Green = right, red = wrong, blue = answered in an exam not yet submitted; a dot marks a flag.

    <div class="qnav-legend">${legend}<span><i></i>Not yet</span><span><i class="flg"></i>Flagged</span></div>

}
const MAP = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="1.5" width="5" height="5" rx="1"/><rect x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>';

function renderNav(s) { const el = $("qnav"); if (!el) return; const g = el.querySelector(".qnav-grid"), top = g ? g.scrollTop : 0; el.innerHTML = navHTML(s); el.querySelector(".qnav-grid").scrollTop = top; }

/* ---------- Notes ---------- */
// Notes belong to the question, not a session, so they show in every session that has it.
let noteId = null, noteDelArmed = false;

  $("note-modal").hidden = false; $("note-text").focus();

function closeNote() {

function saveNote(text) {

  $("note-del").hidden = !text.trim();
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (noteId != null) closeNote(); else if (S.mapOpen) { setMap(false); $("qnav-toggle").focus(); }
});

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  if (e.target.id === "note-modal") { closeNote(); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.dataset.act === "note") { openNote(t.closest(".card").dataset.id); return; }
  if (t.dataset.act === "note-done") { closeNote(); return; }
  if (t.dataset.act === "note-del") {
    if (!noteDelArmed) { noteDelArmed = true; t.textContent = "Confirm delete"; t.classList.add("danger"); return; }
    delete store.notes[noteId]; store.dirty = true; persist(); closeNote(); return;
  }
  const act = t.dataset.act, arg = t.dataset.arg, s = S.viewUid && sess(S.viewUid);
  const card = t.closest(".card"), id = card && card.dataset.id;
  if (act !== "del" && act !== "finish") S.armed = null;

  if (act === "answer" && s && !s.end) {
    s.answers[id] = +arg; S.armed = null; commit(s); refreshCard(s, id);
    const c = $("q-" + id), b = c.querySelector(`[data-arg="${arg}"]`);
    (b && !b.disabled ? b : c.querySelector("[data-act=flag]")).focus({ preventScroll: true });
    return;
  }
  if (act === "clear-answer" && s && !s.end) {
    delete s.answers[id]; commit(s); refreshCard(s, id);
    $("q-" + id).querySelector(".opt").focus({ preventScroll: true }); return;
  }
  if (act === "flag" && s && !s.end) {
    s.flags[id] ? delete s.flags[id] : (s.flags[id] = 1); commit(s); refreshCard(s, id);
    $("q-" + id).querySelector("[data-act=flag]").focus({ preventScroll: true }); return;
  }
  if (act === "finish" && s) {
    if (qidsOf(s).length - answeredOf(s) && S.armed !== "finish") { S.armed = "finish"; renderDock(); return; }
    S.armed = null; finishSession(s); renderAll(); window.scrollTo({ top: 0 }); return;
  }
  if (act === "topic") {
    if (S.topics.has(arg)) { if (S.topics.size > 1) S.topics.delete(arg); } else S.topics.add(arg);
    renderAll(); return;
  }
  if (act === "topic-all") { S.topics = new Set(tKeys(S.subject)); renderAll(); return; }
  if (act === "subject") {
    if (S.subject !== arg) { S.subject = arg; S.topics = new Set(tKeys(arg)); S.picked = new Set(); S.source = "all"; S.msg = null; }
    store.subject = arg; persist(); renderAll(); return;
  }
  if (act === "source") { S.source = arg; renderAll(); return; }
  if (act === "kind") { S.kinds[arg] = t.checked; renderAll(); return; }
  if (act === "mode") { S.mode = arg; renderAll(); return; }
  if (act === "pick") { t.checked ? S.picked.add(arg) : S.picked.delete(arg); if (t.checked) S.source = "sessions"; renderAll(); return; }
  if (act === "pick-all") { S.picked = t.checked ? new Set(inSubj().map(o => o.uid)) : new Set(); if (t.checked) S.source = "sessions"; renderAll(); return; }
  if (act === "pick-all-review") { S.picked = new Set(inSubj().map(o => o.uid)); S.kinds = { wrong: true, flagged: true }; S.source = "sessions"; renderAll(); return; }
  if (act === "start") {
    const ids = plannedIds(); if (!ids.length) return;
    startSession(ids, sourceLabel(), S.mode, tKeys(S.subject).filter(k => S.topics.has(k))); return;
  }
  if (act === "open") {
    const o = sess(arg); if (!o) return;
    if (!o.end && store.activeUid !== o.uid) { const a = store.activeUid && sess(store.activeUid); if (a) finishSession(a); store.activeUid = o.uid; persist(); }
    S.subject = subjOf(o); S.viewUid = o.uid; S.status = "all"; S.search = ""; S.msg = null; renderAll(); window.scrollTo({ top: 0 }); return;
  }
  if (act === "retry-one") {
    const o = sess(arg); if (!o) return;
    const ids = Q.map(q => q.id).filter(q => reviewOf(o).includes(q)), sj = subjOf(o);
    if (S.subject !== sj) { S.subject = sj; S.topics = new Set(tKeys(sj)); S.picked = new Set(); }
    startSession(shuffle(ids), `Wrong + flagged from #${num(o.uid)}`, "practice", tKeys(sj).filter(k => ids.some(q => byId[q].t === k))); return;
  }
  if (act === "finish-active") { const a = sess(store.activeUid); if (a) finishSession(a); renderAll(); return; }
  if (act === "del") {
    if (S.armed !== "del:" + arg) { S.armed = "del:" + arg; renderAll(); setTimeout(() => { if (S.armed === "del:" + arg) { S.armed = null; renderAll(); } }, 4000); return; }
    store.sessions = store.sessions.filter(o => o.uid !== arg); S.picked.delete(arg);
    if (store.activeUid === arg) store.activeUid = null;
    S.armed = null; S.msg = { text: "Session deleted." }; commit(); renderAll(); return;
  }
  if (act === "map-toggle") { setMap(!S.mapOpen); return; }
  if (act === "map-close") { setMap(false); $("qnav-toggle").focus(); return; }
  if (act === "jump" && s) {
    if (window.matchMedia("(max-width: 1000px)").matches) setMap(false);
    if (!$("q-" + arg)) { S.status = "all"; S.search = ""; $("status").value = "all"; $("search").value = ""; $("list").innerHTML = listHTML(s); }
    const c = $("q-" + arg); if (!c) return;
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    c.scrollIntoView({ behavior: still ? "auto" : "smooth", block: "start" });
    c.classList.add("flash"); setTimeout(() => c.classList.remove("flash"), 1200);
    const first = c.querySelector(".opt:not(:disabled)") || c.querySelector("[data-act=note]");
    if (first) first.focus({ preventScroll: true });
    return;
  }
  if (act === "home") { S.mapOpen = false; }
  if (act === "home") { S.viewUid = null; S.msg = null; renderAll(); window.scrollTo({ top: 0 }); return; }
  if (act === "save") { saveFile(); return; }
  if (act === "load") { $("load-file").value = ""; $("load-file").click(); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "len") { S.len = +t.value; renderAll(); }
  else if (t.id === "shuf") { S.shuffle = t.checked; }
  else if (t.id === "shufopt") { S.shuffleOpts = store.shuffleOpts = t.checked; persist(); }
  else if (t.id === "status") { S.status = t.value; const s = sess(S.viewUid); if (s) $("list").innerHTML = listHTML(s); }
  else if (t.id === "load-file" && t.files[0]) loadFile(t.files[0]);
});
document.addEventListener("input", e => {
  if (e.target.id === "note-text" && noteId != null) { saveNote(e.target.value); return; }
  if (e.target.id !== "search") return;
  S.search = e.target.value; const s = sess(S.viewUid); if (s) $("list").innerHTML = listHTML(s);
});

renderAll();
</script>
